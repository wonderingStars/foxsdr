openapi: 3.0.3
info:
  title: FoxSDR web remote
  version: 0.99.108
  description: "The HTTP interface of FoxSDR's built-in web server (src/net/web_server.cpp), read from that file's routes at engine/multi-radio d3630d78. It is the page the receiver serves to a browser plus the JSON and streaming routes the page uses. The server is OFF until the user turns it on. It has no TLS. A bind to anything but the loopback address is refused unless a password is set (src/net/web_policy.hpp). Where this file and the source disagree, the source is right; tests/packaging/test_openapi_routes.py fails when a route in the source is missing here."
  license:
    name: PolyForm Noncommercial 1.0.0
    url: https://github.com/wonderingStars/foxsdr/blob/master/LICENSE
servers:
  - url: http://127.0.0.1:8073
    description: "The default bind address and port (kDefaultWebPort 8073 in src/core/server_ports.hpp). The user chooses both in the settings."
security:
  - cookieAuth: []
tags:
  - name: page
    description: "The page and its fonts. Never need a sign-in."
  - name: session
    description: "Sign in, sign out and ask whether a sign-in is needed."
  - name: receiver
    description: "Read the receiver and change it."
paths:
  /:
    get:
      tags: [page]
      operationId: getIndex
      summary: The web page (HTML)
      description: "Sent with a strict Content-Security-Policy: no inline script or style, no external origin, no framing. Needs no sign-in: the page itself asks /api/session whether to show the sign-in form."
      security: []
      responses:
        "200":
          description: "The page."
          content:
            text/html:
              schema:
                type: string
  /status.json:
    get:
      tags: [page]
      operationId: getStatusJson
      summary: The public receiver listing (off by default)
      description: "The document a receiver directory (Receiverbook) reads to list a web receiver (src/net/receiver_listing.hpp). Needs no sign-in, because a directory's crawler has no cookie; it reads no receiver state and holds only what the user typed (receiver name, location text, optional latitude and longitude, a list of bands with a centre frequency and a sample rate each), plus the program version and the listener limit. It holds no operator e-mail address, altitude, serial number, radio model, address of this machine or session. The listing is OFF until the user turns it on and fills it in; while it is off, or when it was never set, the route answers 404 exactly as a path that was never served would. A request for it is not counted as program usage."
      security: []
      responses:
        "200":
          description: "The listing, as JSON."
          content:
            application/json:
              schema:
                type: object
                required: [receiver, max_clients, version, sdrs]
                properties:
                  receiver:
                    type: object
                    required: [name, location]
                    properties:
                      name:
                        type: string
                        description: "The receiver's public name, 1 to 64 bytes."
                      location:
                        type: string
                        description: "Free text, at most 96 bytes; may be empty."
                      gps:
                        type: object
                        description: "Present only when the user typed both a latitude and a longitude."
                        required: [lat, lon]
                        properties:
                          lat:
                            type: number
                            description: "Degrees, -90 to 90."
                          lon:
                            type: number
                            description: "Degrees, -180 to 180."
                  max_clients:
                    type: integer
                    description: "The listener limit the host publishes, 1 to 1000."
                  version:
                    type: string
                    description: "The program version, at most 32 printable ASCII characters."
                  sdrs:
                    type: array
                    description: "Always one entry, named like the receiver, of type FoxSDR."
                    items:
                      type: object
                      required: [name, type, profiles]
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                          description: "The constant FoxSDR."
                        profiles:
                          type: array
                          description: "The listed bands (at most 32), in the order the user typed them."
                          items:
                            type: object
                            required: [name, center_freq, sample_rate]
                            properties:
                              name:
                                type: string
                                description: "1 to 48 bytes."
                              center_freq:
                                type: integer
                                description: "Hz, rounded, 1 to 1e12."
                              sample_rate:
                                type: integer
                                description: "Hz, rounded, 1 to 1e10."
        "404":
          description: "The listing is off (the default) or was never set."
  /app.css:
    get:
      tags: [page]
      operationId: getAppCss
      summary: The page's style sheet
      description: "Needs no sign-in."
      security: []
      responses:
        "200":
          description: "The style sheet."
          content:
            text/css:
              schema:
                type: string
  /app.js:
    get:
      tags: [page]
      operationId: getAppJs
      summary: The page's script
      description: "Needs no sign-in."
      security: []
      responses:
        "200":
          description: "The script."
          content:
            text/javascript:
              schema:
                type: string
  /font/ui.ttf:
    get:
      tags: [page]
      operationId: getFontUi
      summary: The interface typeface
      description: "SIL Open Font License, served byte for byte, Cache-Control public, max-age=31536000, immutable. Needs no sign-in."
      security: []
      responses:
        "200":
          description: "The font file."
          content:
            font/ttf:
              schema:
                type: string
                format: binary
  /font/legend.ttf:
    get:
      tags: [page]
      operationId: getFontLegend
      summary: The legend typeface
      description: "SIL Open Font License, served byte for byte, immutable. Needs no sign-in."
      security: []
      responses:
        "200":
          description: "The font file."
          content:
            font/ttf:
              schema:
                type: string
                format: binary
  /font/reading.ttf:
    get:
      tags: [page]
      operationId: getFontReading
      summary: The reading typeface
      description: "SIL Open Font License, served byte for byte, immutable. Needs no sign-in."
      security: []
      responses:
        "200":
          description: "The font file."
          content:
            font/ttf:
              schema:
                type: string
                format: binary
  /api/session:
    get:
      tags: [session]
      operationId: getSession
      summary: Is a sign-in needed, and is this client signed in
      description: "Needs no sign-in. Reveals nothing beyond whether a credential is needed and whether this client holds a valid one."
      security: []
      responses:
        "200":
          description: "The sign-in state."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
  /api/login:
    post:
      tags: [session]
      operationId: login
      summary: Sign in
      description: "Needs no sign-in. The body must be JSON (a CSRF defence: a cross-origin form cannot send it). Failed attempts are throttled per client address. On success the response sets the foxsdr_session cookie (Path=/; HttpOnly; SameSite=Strict; not Secure, because the server has no TLS). Checks are made in the order 415, 429, 400, 409, 401."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Signed in. The session cookie is in the Set-Cookie header."
          headers:
            Set-Cookie:
              description: "foxsdr_session=<token>; Path=/; HttpOnly; SameSite=Strict"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOk"
        "400":
          description: "The body is not valid JSON."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Wrong user name or password (counted by the throttle)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "This address, or this listener name, is banned from joining."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "No password is set on this receiver, so there is nothing to sign in to; or the listener name is already in use."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body is over the 8 KiB limit (the server's payload cap; the status is the vendored HTTP library's PayloadTooLarge_413)."
        "415":
          description: "The Content-Type is not application/json."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Too many failed sign-in attempts from this address; try again after the time in Retry-After."
          headers:
            Retry-After:
              description: "Seconds to wait."
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The listener limit has been reached; try again after the time in Retry-After (30 s)."
          headers:
            Retry-After:
              description: "Seconds to wait."
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "A session could not be created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/logout:
    post:
      tags: [session]
      operationId: logout
      summary: Sign out
      description: "Needs no sign-in. Revokes the presented session, if any, and clears the cookie (Max-Age=0)."
      security: []
      responses:
        "200":
          description: "Done."
          headers:
            Set-Cookie:
              description: "The cookie, expired."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
  /api/status:
    get:
      tags: [receiver]
      operationId: getStatus
      summary: The whole receiver state
      description: "Needs a sign-in when the server runs with a password. THIS CALL, and no other, is the web session's heartbeat: the engine judges the remote transmit key's keep-alive from it (2 s window), so a client that holds the transmit key must keep polling it."
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "The state."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/SignInFirst"
  /api/audio:
    get:
      tags: [receiver]
      operationId: getAudio
      summary: The audio the receiver is playing, as a stream
      description: "Needs a sign-in when the server runs with a password. A chunked response that never ends until the client closes it or the server stops: signed 16-bit little-endian PCM, 48 kHz, mono. At most 4 listeners at once."
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "The stream."
          content:
            "audio/L16;rate=48000;channels=1":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/SignInFirst"
        "503":
          description: "The receiver is not available to this server, or 4 listeners are already connected."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/image/{index}:
    get:
      tags: [receiver]
      operationId: getImage
      summary: One picture a plugin has drawn
      description: "Needs a sign-in when the server runs with a password. The index is the position in the status response's images list."
      parameters:
        - name: index
          in: path
          required: true
          description: "Zero-based index into the status response's images list."
          schema:
            type: integer
            minimum: 0
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "The picture as a BMP."
          content:
            image/bmp:
              schema:
                type: string
                format: binary
        "400":
          description: "The index is not a number this server can read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SignInFirst"
        "404":
          description: "No picture at that index."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/tile/{z}/{x}/{y}:
    get:
      tags: [receiver]
      operationId: getTile
      summary: One map tile
      description: "Needs a sign-in when the server runs with a password. A tile that is not held yet is queued for the application to fetch and answered 202; ask again shortly."
      parameters:
        - name: z
          in: path
          required: true
          description: "Zoom level, 0 to 22."
          schema:
            type: integer
            minimum: 0
            maximum: 22
        - name: x
          in: path
          required: true
          description: "Tile column, 0 to 2^z - 1."
          schema:
            type: integer
            minimum: 0
        - name: y
          in: path
          required: true
          description: "Tile row, 0 to 2^z - 1."
          schema:
            type: integer
            minimum: 0
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "The tile as a BMP."
          content:
            image/bmp:
              schema:
                type: string
                format: binary
        "202":
          description: "Not held yet; it has been requested."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pending"
        "400":
          description: "The address is not a tile (not numbers, zoom over 22, or x or y outside the zoom's range)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SignInFirst"
        "404":
          description: "No such tile."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/control:
    post:
      tags: [receiver]
      operationId: postControl
      summary: Change the receiver
      description: "Needs a sign-in when the server runs with a password. The body is ONE JSON object of the fields below; absent fields are left alone; an unknown field, an empty object, a value out of range, NaN or infinity is refused with 400. Nothing is applied here: the request is validated, queued, and answered 202; the receiver applies it on its next frame, so read /api/status to see the result."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlRequest"
      security:
        - cookieAuth: []
      responses:
        "202":
          description: "Accepted and queued."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          description: "Refused: not a JSON object, an unknown field, a value out of range, a mode name that does not exist, or an empty object. The error text names which."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SignInFirst"
        "403":
          description: "A listener asked: listeners cannot control the receiver, or (when the server lets them tune) may only change frequency, mode and bandwidth."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "transmitPtt was asked for but no transmitter is open, or remote transmit is not allowed at the desk."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body is over the 8 KiB limit (the status is the vendored HTTP library's PayloadTooLarge_413)."
        "415":
          description: "The Content-Type is not application/json."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The receiver is not available to this server, or its state could not be read just now; try again."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/spectrum:
    get:
      tags: [receiver]
      operationId: getSpectrum
      summary: The latest spectrum line
      description: "Needs a sign-in when the server runs with a password. Poll with the seq of the last answer in since; fresh is false when there is nothing newer."
      parameters:
        - name: since
          in: query
          required: false
          description: "The seq of the last line the client holds. A value that is not a number, or one this server run has never issued, is treated as 0 (send anything)."
          schema:
            type: integer
            minimum: 0
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "The line, or fresh false."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spectrum"
        "401":
          $ref: "#/components/responses/SignInFirst"
  /api/room:
    get:
      tags: [room]
      operationId: getRoom
      summary: The room - who is on, what listeners may do, the owner's note
      description: "Needs a sign-in (the owner's or a listener's). The counts are 0 while listener accounts are off."
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "The room state."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/SignInFirst"
  /api/chat:
    get:
      tags: [room]
      operationId: getChat
      summary: Chat lines since a cursor
      description: "Needs a sign-in. enabled is false, and lines empty, unless listener accounts and chat are both on. Lines are escaped for the page."
      parameters:
        - name: since
          in: query
          required: false
          description: "The seq of the last chat line the client holds. A value that is not a number counts as 0."
          schema:
            type: integer
            minimum: 0
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "The lines newer than since."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatLines"
        "401":
          $ref: "#/components/responses/SignInFirst"
    post:
      tags: [room]
      operationId: postChat
      summary: Say something in the chat
      description: "Needs a sign-in. The body is JSON with text (200 bytes at most after clean-up). Rate limited per person: a few messages every ten seconds."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatPost"
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "Posted."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: "The body is not valid JSON, the text is empty, or it is not valid text."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SignInFirst"
        "403":
          description: "Chat is off."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body is over the 8 KiB limit (the status is the vendored HTTP library's PayloadTooLarge_413), or the text is over 200 bytes."
        "415":
          description: "The Content-Type is not application/json."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Too many messages; try again after the time in Retry-After."
          headers:
            Retry-After:
              description: "Seconds to wait."
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/state:
    get:
      tags: [room]
      operationId: getAdminState
      summary: The owner's view of the room (listeners, bans, audit trail)
      description: "Needs the OWNER's sign-in. This is the one place a listener's address is shown, to the owner, live. A listener who asks is refused and the refusal is audited."
      parameters:
        - name: since
          in: query
          required: false
          description: "The seq of the last audit line the client holds. A value that is not a number counts as 0."
          schema:
            type: integer
            minimum: 0
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "The room as the owner sees it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminState"
        "401":
          $ref: "#/components/responses/SignInFirst"
        "403":
          description: "Only the owner can do that."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin:
    post:
      tags: [room]
      operationId: postAdmin
      summary: Moderate the room (kick, ban, unban, note)
      description: "Needs the OWNER's sign-in. The body is JSON with op, one of kick, ban, banAddress, unban, unbanAddress or note, and the field that op needs (name, address or text). A listener who asks is refused and the refusal is audited."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOp"
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "Done; ended says how many sessions it ended."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDone"
        "400":
          description: "The body is not valid JSON, the op is unknown, or it could not be done (no such entry, a bad name, a full list, or text that is not valid)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SignInFirst"
        "403":
          description: "Only the owner can do that."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "The body is over the 8 KiB limit (the status is the vendored HTTP library's PayloadTooLarge_413), or the text is over 200 bytes."
        "415":
          description: "The Content-Type is not application/json."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/events:
    get:
      tags: [receiver]
      operationId: getEvents
      summary: Live status updates (server-sent events)
      description: "Server-sent events: an event named status with the status JSON as one line whenever it changed (the first at once), a keep-alive comment after 15 s of silence, retry 3000. Needs the same sign-in as every route, re-checked on each look so signing out ends the stream. The number of open streams is capped (the audio listener limit, or the listener limit plus two while listener accounts are on), then 503. It is NOT the heartbeat: keep polling /api/status while a transmit key is held."
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "The event stream."
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/SignInFirst"
        "503":
          description: "The cap on open streams has been reached."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: foxsdr_session
      description: "Sign-in rule. With no password set (allowed only on the loopback address) every route answers without a cookie. With a password set (required for any other address, enforced on loopback too) every route marked with this scheme answers 401 with the error sign in first unless the request carries a valid foxsdr_session cookie from POST /api/login. At most 32 sessions are held at once."
  responses:
    SignInFirst:
      description: "A password is set and the request carries no valid session cookie."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: "A sentence fit to show the user."
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    Accepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
    Pending:
      type: object
      required: [pending]
      properties:
        pending:
          type: boolean
    SessionState:
      type: object
      required: [authRequired, authenticated, reachableOffMachine]
      properties:
        authRequired:
          type: boolean
          description: "A sign-in is needed."
        authenticated:
          type: boolean
          description: "This request holds a valid session (always true when no sign-in is needed)."
        reachableOffMachine:
          type: boolean
          description: "The server is bound to an address other machines can reach."
        role:
          type: string
          enum: [owner, listener, none]
          description: "Who this request is: the owner, a listener who joined under a name, or nobody."
        listenersEnabled:
          type: boolean
          description: "Listener accounts are switched on."
        secure:
          type: boolean
          description: "The page is served over HTTPS."
        name:
          type: string
          description: "The listener's name. Present only when role is listener."
    LoginOk:
      type: object
      required: [ok, role]
      properties:
        ok:
          type: boolean
        role:
          type: string
          enum: [owner, listener]
          description: "Which account signed in."
    Room:
      type: object
      required: [role, listenersEnabled, listeners, maxListeners, mayTune, chatEnabled, chatSeq, noteSeq, note]
      properties:
        role:
          type: string
          enum: [owner, listener]
        name:
          type: string
          description: "The listener's name. Present only for a listener."
        listenersEnabled:
          type: boolean
        listeners:
          type: integer
          description: "Listeners on now (0 while listener accounts are off)."
        maxListeners:
          type: integer
          description: "The limit (0 while listener accounts are off)."
        mayTune:
          type: boolean
          description: "This client may change frequency, mode and bandwidth."
        chatEnabled:
          type: boolean
        chatSeq:
          type: integer
          description: "The seq of the newest chat line."
        noteSeq:
          type: integer
          description: "Changes whenever the owner's note does."
        note:
          type: string
          description: "The owner's note, escaped for the page."
    ChatLine:
      type: object
      required: [seq, t, name, owner, html]
      properties:
        seq:
          type: integer
        t:
          type: integer
          description: "Seconds since the epoch."
        name:
          type: string
        owner:
          type: boolean
          description: "The line is the owner's."
        html:
          type: string
          description: "The text, escaped: the page may put it in as it is."
    ChatLines:
      type: object
      required: [enabled, seq, lines]
      properties:
        enabled:
          type: boolean
        seq:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ChatLine"
    ChatPost:
      type: object
      properties:
        text:
          type: string
          description: "Defaults to the empty string, which is refused."
    AdminListener:
      type: object
      required: [name, address, signedInSeconds, idleSeconds]
      properties:
        name:
          type: string
        address:
          type: string
        signedInSeconds:
          type: integer
        idleSeconds:
          type: integer
    AuditLine:
      type: object
      required: [seq, t, kind, name]
      properties:
        seq:
          type: integer
        t:
          type: integer
          description: "Seconds since the epoch."
        kind:
          type: string
        name:
          type: string
    AdminState:
      type: object
      required: [listeners, bannedNames, bannedAddresses, audit]
      properties:
        listeners:
          type: array
          items:
            $ref: "#/components/schemas/AdminListener"
        bannedNames:
          type: array
          items:
            type: string
        bannedAddresses:
          type: array
          items:
            type: string
        audit:
          type: array
          items:
            $ref: "#/components/schemas/AuditLine"
    AdminOp:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [kick, ban, banAddress, unban, unbanAddress, note]
        name:
          type: string
          description: "For kick, ban and unban."
        address:
          type: string
          description: "For banAddress and unbanAddress."
        text:
          type: string
          description: "For note: the note's text (200 bytes at most)."
    AdminDone:
      type: object
      required: [ok, ended]
      properties:
        ok:
          type: boolean
        ended:
          type: integer
          description: "How many sessions the action ended."
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          description: "Defaults to the empty string, which never matches."
        password:
          type: string
          description: "Defaults to the empty string, which never matches."
    Spectrum:
      type: object
      required: [seq, fresh, dbMin, dbMax]
      properties:
        seq:
          type: integer
          description: "Sequence number of this line."
        fresh:
          type: boolean
          description: "False when there is no line newer than since; centerHz, spanHz and bins are then absent."
        dbMin:
          type: number
          description: "The level that the quantised value 0 stands for."
        dbMax:
          type: number
          description: "The level that the quantised value 255 stands for."
        centerHz:
          type: number
        spanHz:
          type: number
        bins:
          type: string
          description: "One byte per bin, base64, quantised between dbMin and dbMax."
    ControlRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: "Every field is optional, but at least one must be present. Ranges are the ones in src/net/web_control.hpp."
      properties:
        running:
          type: boolean
          description: "Start or stop the receiver."
        centerHz:
          type: number
          minimum: 0
          maximum: 6000000000
          description: "Source centre frequency, Hz."
        vfoOffsetHz:
          type: number
          minimum: -100000000
          maximum: 100000000
          description: "Tuned offset from the centre, Hz."
        mode:
          type: string
          description: "A demodulator name exactly as the desktop and the config file spell it (dsp::modeFromName), case-sensitive."
        bandwidthHz:
          type: number
          minimum: 100
          maximum: 10000000
        squelchDb:
          type: number
          minimum: -200
          maximum: 20
        volume:
          type: number
          minimum: 0
          maximum: 1
        dbMin:
          type: number
          minimum: -200
          maximum: 40
          description: "Display range floor; the application keeps it below dbMax."
        dbMax:
          type: number
          minimum: -200
          maximum: 40
        deemphasisIndex:
          type: integer
          description: "0 = 50 us, 1 = 75 us, 2 = off."
        nrEnabled:
          type: boolean
        nrStrength:
          type: number
          minimum: 0
          maximum: 1
        notchEnabled:
          type: boolean
        notchFreqHz:
          type: number
          minimum: 10
          maximum: 20000
        notchQ:
          type: number
          minimum: 0.1
          maximum: 1000
        autoNotch:
          type: boolean
        stereoEnabled:
          type: boolean
        sourceKind:
          type: string
          description: "One of siggen, soapy, rtlsdr, hackrf, airspy, airspyhf, sdrplay, mirisdr, rx888, pluto, aor, hydrasdr, rtltcp. There is deliberately no file source: a browser cannot name a path on the machine."
        soapyArgs:
          type: string
          description: "A device's args string as the scan reported it; matched against the scanned list, never passed to a driver verbatim."
        antenna:
          type: string
        sampleRateHz:
          type: number
          minimum: 8000
          maximum: 61440000
        gainName:
          type: string
          description: "Set together with gainDb."
        gainDb:
          type: number
          minimum: -30
          maximum: 100
        agc:
          type: boolean
        scanDevices:
          type: boolean
          description: "Ask the application to enumerate radios; the result appears in a later status."
        recordIq:
          type: boolean
        recordAudio:
          type: boolean
          description: "Recordings land in the directory the application already uses; it cannot be set from here."
        bookmarkAdd:
          type: string
          description: "Add the current frequency under this name."
        bookmarkTune:
          type: integer
          description: "Index into the bookmarks the status lists."
        bookmarkRemove:
          type: integer
          description: "Index into the bookmarks the status lists."
        scannerActive:
          type: boolean
        scannerSkip:
          type: boolean
          description: "Move on from the signal being heard."
        scanStartHz:
          type: number
          minimum: 0
          maximum: 6000000000
        scanStopHz:
          type: number
          minimum: 0
          maximum: 6000000000
        scanStepHz:
          type: number
          minimum: 100
          maximum: 10000000
        pluginFetch:
          type: boolean
          description: "Fetch the plugin catalogue (the only call that contacts the catalogue origin, and only when asked)."
        pluginInstall:
          type: string
          description: "Install the catalogue entry with this id. Refused by the same gate as the desktop unless acknowledgeNotice is true."
        acknowledgeNotice:
          type: boolean
          description: "The browser's equivalent of ticking the legal-notice box."
        pluginRemove:
          type: string
          description: "Remove an installed plugin by the file name the status reports."
        pluginTuneName:
          type: string
          description: "Set together with pluginTuneAllowed."
        pluginTuneAllowed:
          type: boolean
          description: "Grant or revoke that plugin's permission to move the receiver."
        pluginPresetName:
          type: string
          description: "Set together with pluginPresetIndex."
        pluginPresetIndex:
          type: integer
          description: "Apply one of that plugin's declared presets."
        transmitPtt:
          type: boolean
          description: "A PTT held down, not a switch: true buys one bounded hold and must be repeated; false opens the key at once. Refused with 409 unless a transmitter is open. A body carrying transmitLatch or transmitLatched is refused by name."
        muted:
          type: boolean
          description: "Mute or unmute the audio."
