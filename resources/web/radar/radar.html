<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fox &amp; Schirmer Radar Unit</title>
<link rel="stylesheet" href="radar.css">
</head>
<body>
<div class="room">
  <div class="cabinet">
    <div class="inner-rule"></div>

    <div class="screws screws-top">
      <div class="screw"><i class="slot s28"></i></div>
      <div class="screw"><i class="slot sm14"></i></div>
    </div>

    <div class="deck-gap"></div>

    <!-- ===================== UPPER DECK ===================== -->
    <div class="upper">

      <!-- signal bargraph -->
      <div class="bargraph">
        <div class="bg-cap">SIG</div>
        <div class="bg-bars" id="sigBars"></div>
        <div class="bg-val" id="sigLabel">--</div>
      </div>

      <!-- round scope -->
      <div class="scope-bay">
        <div class="corner tl"><span id="trackCount">--</span><br><small>TRACKS</small></div>
        <div class="corner tr"><span id="rangeNm">--</span><br><small>NM</small></div>
        <div class="corner bl" id="modeLabel">MODE ALL</div>
        <div class="corner br" id="homePos">POSITION NOT SET</div>

        <div class="scope" id="scope">
          <div class="scope-live" id="scopeLive">
            <canvas class="scope-map" id="scopeMap" width="400" height="400"></canvas>
            <div class="rings" id="rings"></div>
            <div class="cross-v"></div>
            <div class="cross-h"></div>
            <div class="home-dot"></div>
            <div class="sweep" id="sweep"></div>
            <div class="targets" id="targets"></div>
            <div class="scanlines"></div>
            <div class="vignette"></div>
            <div class="altkey" id="altKey"></div>
            <div class="attrib" id="attrib"></div>
          </div>
          <div class="scope-dark" id="scopeDark">
            <div class="off-label" id="scopeOffLabel">STANDBY</div>
          </div>
        </div>
      </div>

      <!-- LCD panel -->
      <div class="lcd-bay">
        <div class="tabs">
          <div class="tab" id="tabHome" data-screen="home">HOME</div>
          <div class="tab" id="tabFlight" data-screen="flight">FLIGHT</div>
          <div class="tab" id="tabSys" data-screen="sys">SYS</div>
        </div>

        <div class="lcd">
          <div class="scanlines lcd-lines"></div>

          <div class="screen" id="screenBoot"></div>

          <div class="screen" id="screenFlight">
            <div class="carrier-bar" id="carrierBar">
              <div class="carrier-dot"></div>
              <div class="carrier-name" id="selCarrier">NO CONTACT</div>
            </div>
            <div class="carrier-sub" id="selSub">&nbsp;</div>
            <div class="rows" id="detailRows"></div>
          </div>

          <div class="screen" id="screenHome">
            <div class="lcd-cap">CONTACTS IN RANGE</div>
            <div class="big-count" id="homeCount">0</div>
            <div class="home-grid" id="homeStats"></div>
          </div>

          <div class="screen" id="screenSys">
            <div class="lcd-cap">SYSTEM OPTIONS</div>
            <div class="opts" id="options"></div>
          </div>

          <div class="lcd-off" id="lcdOff"></div>
        </div>

        <div class="lcd-buttons">
          <button class="pbtn" id="prevTrack" type="button">&#9664; PREV</button>
          <button class="pbtn" id="nextTrack" type="button">NEXT &#9654;</button>
        </div>
      </div>

      <!-- altitude bargraph -->
      <div class="bargraph">
        <div class="bg-cap">ALT</div>
        <div class="bg-bars" id="altBars"></div>
        <div class="bg-val" id="altLabel">--</div>
      </div>
    </div>

    <!-- ===================== LOWER DECK ===================== -->
    <div class="lower">

      <div class="plate-bay">
        <div>
          <div class="brand">
            <div class="brand-fox">FOX</div>
            <div class="brand-diamond"></div>
          </div>
          <div class="brand-sub">&amp; SCHIRMER INDUSTRIES</div>
        </div>
        <div class="drums">
          <div>
            <div class="drum-cap">RANGE NM</div>
            <div class="drum-row" id="rangeDrum"></div>
          </div>
          <div>
            <div class="drum-cap">TRACKS</div>
            <div class="drum-row" id="trackDrum"></div>
          </div>
        </div>
      </div>

      <div class="knob-bay">
        <div class="ctl-cap">RANGE</div>
        <div class="knob-well">
          <div class="ticks" id="knobTicks"></div>
          <div class="knob" id="knob">
            <div class="knob-dial" id="knobDial"><i class="knob-mark"></i></div>
          </div>
        </div>
        <div class="ctl-hint">DRAG TO SET</div>
      </div>

      <div class="power-bay">
        <div class="ctl-cap">POWER</div>
        <button class="power-well" id="power" type="button" aria-label="Power">
          <span class="power-lamp" id="powerLamp">
            <i class="pg-stem"></i>
            <i class="pg-ring"></i>
          </span>
        </button>
        <div class="ctl-hint" id="powerLabel">ON LINE</div>
      </div>
    </div>

    <div class="deck-gap-bottom"></div>
    <div class="screws screws-bottom">
      <div class="screw"><i class="slot sm40"></i></div>
      <div class="screw"><i class="slot s12"></i></div>
    </div>
  </div>
</div>

<div class="link-state" id="linkState" hidden></div>

<script src="radar.js"></script>
</body>
</html>
