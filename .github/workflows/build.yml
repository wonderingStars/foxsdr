# Continuous build and test.
#
# Linux is built and tested on every push, on both x86_64 (ubuntu-latest) and
# aarch64 (ubuntu-24.04-arm, GitHub's hosted Arm64 runner for public repos -
# see the "arm64" job below) for the Raspberry Pi and other Arm64 Linux
# desktops.
#
# Windows is built here too, by the "windows" job at the end of this file: the
# Release build, the Inno Setup installer, the MSIX and the symbol archive. The
# one thing that kept it out of CI was SoapySDR, the only dependency that is not
# vendored: a runner that installed its own copy would be building against a
# different dependency set than the shipped installer. The job therefore takes
# SoapySDR from a vcpkg checkout pinned to the commit of the vcpkg tree the
# shipped installer is built against (read the job's comments), not from
# whatever the runner image carries. It builds and packages and does not run
# the test suite, and the installer that ships is still the one
# tools/release.ps1 builds and install-tests on the release machine; the
# artifacts of this job are what that one is compared with. The job is new and
# has not run on a runner yet.
name: build

# Push builds run on master AND on integration/release branches (integ*,
# release/*), so the Linux artifacts for a release start building when the
# integration branch is pushed rather than only after the final merge to
# master. The jobs themselves are identical on every branch.
on:
  push:
    branches: [master, 'integ*', 'release/*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libasound2-dev is PortAudio's backend; the -plugins package lets ALSA's
      # default device route to a sound server, which is what makes the audio
      # test meaningful on a machine with no hardware card.
      #
      # The wayland packages are not optional on a runner: GLFW enables Wayland
      # whenever it finds the headers, and the runner image ships those but not
      # libwayland-bin, so configure fails looking for wayland-scanner. Adding
      # the tool is the right fix rather than switching Wayland off — it is the
      # default session on current desktops, and X11-only would leave those
      # users on XWayland.
      #
      # libunwind-dev is the Linux crash handler's and hang watchdog's local
      # unwinder (CMakeLists.txt, pkg_check_modules(LIBUNWIND REQUIRED)).
      # Without it configure stops at "The following required packages were
      # not found: libunwind" - which is how every push from 0.99.2 to 0.99.4
      # failed here in about thirty seconds, and why those releases' Linux
      # builds had to be made by hand.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libsoapysdr-dev libssl-dev libunwind-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libasound2-dev libasound2-plugins \
            xvfb libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The runner has no audio device at all. Rather than let that fail the
      # job, a dummy ALSA device is provided so the audio path is still
      # exercised; without this the sink tests would have to be skipped, and a
      # skipped test proves nothing.
      - name: Provide a null audio device
        run: |
          sudo modprobe snd-dummy || true
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' | sudo tee /etc/asound.conf

      # Under a virtual X server, because one test opens a real window and a
      # bare runner has no display at all — GLFW reports "failed to detect any
      # supported platform" and the smoke test cannot start. Xvfb plus Mesa's
      # software renderer means that path is actually exercised here rather
      # than excluded, which is the whole point of having it.
      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # The null ALSA fixture can prime but cannot sustain playback. Only
          # test_pipeline_audio_lead skips; the callback/sink tests still run.
          FOXSDR_CI_NULL_AUDIO: "1"
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      # The selftest drives the real DSP chain headlessly and asserts a known
      # spectrum peak, so it catches a build that links and passes unit tests
      # but produces wrong numbers.
      - name: Selftest
        run: ./build/cascade --selftest

      # THE TARBALL HOLDS TWO PROGRAMS: cascade (the window application) and foxsdr-engine (the
      # receiver with no window, for a service or a Raspberry Pi with no desktop - docs/headless-
      # service.md). Both read resources/bandplans and resources/firmware from BESIDE themselves
      # (BandPlan::defaultDir and aorFirmwarePath are executable-relative), so the tarball carries
      # them, laid out the way the AppImage and the Windows installer lay them out. The AppImage
      # below is untouched: it stays a launcher for the window application.
      - name: Package
        run: |
          version=$(sed -n 's/^project(cascade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p "dist/foxsdr-$version-linux-x64/resources/bandplans"
          cp build/cascade build/foxsdr-engine README.md LICENSE PRIVACY.md "dist/foxsdr-$version-linux-x64/"
          cp resources/bandplans/*.json "dist/foxsdr-$version-linux-x64/resources/bandplans/"
          cp -r resources/firmware "dist/foxsdr-$version-linux-x64/resources/"
          tar -C dist -czf "foxsdr-$version-linux-x64.tar.gz" "foxsdr-$version-linux-x64"
          echo "version=$version" >> "$GITHUB_ENV"

      # The tarball is READ BACK before it is uploaded: both binaries and the resources are in it,
      # both are ELF with the execute bit, and each, extracted and run, answers --version with this
      # version (tools/check-linux-tarball.sh; its --self-test is a ctest). It gates the upload on
      # purpose: a tarball without the application downloads fine. NOT YET RUN ON A RUNNER: until a
      # push has run this job the assertion is CI-level evidence only, written and self-tested on
      # stand-in files (docs/engine-stage4.md section 6.20).
      - name: Check the tarball
        run: |
          version=$(sed -n 's/^project(cascade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          bash tools/check-linux-tarball.sh "foxsdr-$version-linux-x64.tar.gz" "foxsdr-$version-linux-x64" "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-x64
          path: foxsdr-*-linux-x64.tar.gz

      # A single-file, double-clickable alternative to the tarball above, for
      # a desktop user who has no interest in extracting an archive and
      # setting up a .desktop entry by hand. installer/linux/build-appimage.sh
      # stages the SAME payload the "Package" step above already produces
      # (the cascade binary and resources/bandplans it reads at runtime) plus
      # the licensing text a distributable build must carry - it does not
      # bundle SoapySDR/OpenSSL/ALSA/OpenGL, so this runner's host libraries
      # are exactly what a machine running the AppImage also needs, same as
      # the tarball already requires.
      #
      # squashfs-tools is not guaranteed on every runner image (appimagetool
      # shells out to the system mksquashfs rather than bundling one), so it
      # is installed explicitly here instead of assuming it rode in with
      # something else.
      - name: Build AppImage
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools
          installer/linux/build-appimage.sh build

      # The AppImage runtime itself needs FUSE to mount, which this runner
      # does not have configured; extract-and-run is the same fallback used
      # to build it, and covers a user's FUSE-less container or CI runner as
      # much as it covers this one - a real desktop session normally has FUSE
      # and never needs it. Both checks mirror the "Selftest" and "Test"
      # steps above: an exact frame count, not just a nonzero exit code.
      - name: Verify AppImage runs
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          version=$(sed -n 's/^project(cascade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          appimage="dist/FoxSDR-$version-x86_64.AppImage"
          "$appimage" --version
          xvfb-run -a "$appimage" --frames 60

      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-x64-appimage
          path: dist/FoxSDR-*-x86_64.AppImage

      # THE SYMBOLS FOR THIS EXACT BUILD, KEPT.
      #
      # The Build step's last action (tools/archive-symbols-linux.sh, wired in
      # CMakeLists.txt) wrote symbols/ on this runner: the split-debug file
      # that carries the line tables, the function map and an index row, keyed
      # by the GNU build id of the very build/cascade the tarball and the
      # AppImage above contain - and the same for build/foxsdr-engine, which
      # only the tarball contains, under its own build id and in the same
      # symbols/ (one artifact, two modules, two index rows). The runner is
      # discarded when the job ends, so
      # without this step the build that reaches users has its symbols
      # nowhere, and every crash report against it can be named at best and
      # never placed on a line. Copying the artifact into the symbol archive is
      # still a manual step - docs/DIAGNOSTICS.md, "Linux symbols".
      #
      # The two steps below are LAST on purpose: the tarball and the AppImage
      # are already uploaded when they run, so a mistake in this bookkeeping
      # can turn the job red but cannot withhold a release artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-x64-symbols
          path: symbols/
          if-no-files-found: warn

      # What a working symbol archive looks like, asserted: the archived file
      # has line tables, the binary that ships has none (a full-DWARF cascade
      # would be tens of megabytes heavier for every user), and a real address
      # in the shipped binary resolves to a function and a line in the archived
      # file with the same addr2line a developer will use. Matches are done
      # with case rather than a pipe into grep -q, because a pipe plus
      # pipefail turns grep's early exit into a spurious failure.
      # Once per binary the tarball carries: the engine's build id is its own, and a crash report from
      # a headless run is readable only if THAT binary's symbols were archived (the Build step's
      # POST_BUILD archived both). The assertions are tools/check-symbol-archive-linux.sh's, which is
      # what this step's body used to be, for cascade alone.
      - name: Check the symbol archive
        run: |
          set -eu
          bash tools/check-symbol-archive-linux.sh cascade main.cpp
          bash tools/check-symbol-archive-linux.sh foxsdr-engine engine_main.cpp

  # Same job as "linux" above, on GitHub's hosted Arm64 runner, for the
  # Raspberry Pi (64-bit Raspberry Pi OS is aarch64) and other Arm64 Linux
  # desktops. "ubuntu-24.04-arm" is GitHub's documented label for the free
  # hosted Arm64 runner available to public repositories; every step below
  # is the "linux" job's step unchanged except for the runner label and the
  # arch-derived file names (build-appimage.sh itself picks its own
  # architecture via `uname -m`, so it needs no arch argument here).
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libsoapysdr-dev libssl-dev libunwind-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libasound2-dev libasound2-plugins \
            xvfb libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Provide a null audio device
        run: |
          sudo modprobe snd-dummy || true
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' | sudo tee /etc/asound.conf

      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          FOXSDR_CI_NULL_AUDIO: "1"
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Selftest
        run: ./build/cascade --selftest

      # The same tarball as the "linux" job's (read the comment there): cascade, foxsdr-engine, the
      # resources beside them, and the read-back that gates the upload. THIS is the job that makes
      # the engine's first aarch64 binary - the Raspberry Pi's - and its --version run below is the
      # first time anything of the engine executes on that architecture.
      - name: Package
        run: |
          version=$(sed -n 's/^project(cascade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p "dist/foxsdr-$version-linux-arm64/resources/bandplans"
          cp build/cascade build/foxsdr-engine README.md LICENSE PRIVACY.md "dist/foxsdr-$version-linux-arm64/"
          cp resources/bandplans/*.json "dist/foxsdr-$version-linux-arm64/resources/bandplans/"
          cp -r resources/firmware "dist/foxsdr-$version-linux-arm64/resources/"
          tar -C dist -czf "foxsdr-$version-linux-arm64.tar.gz" "foxsdr-$version-linux-arm64"
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Check the tarball
        run: |
          version=$(sed -n 's/^project(cascade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          bash tools/check-linux-tarball.sh "foxsdr-$version-linux-arm64.tar.gz" "foxsdr-$version-linux-arm64" "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-arm64
          path: foxsdr-*-linux-arm64.tar.gz

      - name: Build AppImage
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools
          installer/linux/build-appimage.sh build

      - name: Verify AppImage runs
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          version=$(sed -n 's/^project(cascade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          appimage="dist/FoxSDR-$version-aarch64.AppImage"
          "$appimage" --version
          xvfb-run -a "$appimage" --frames 60

      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-arm64-appimage
          path: dist/FoxSDR-*-aarch64.AppImage

      # The same two steps as the "linux" job's closing pair (read the comments
      # there), for the arm64 build. Its build id is its own, so its symbols
      # are a separate artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-arm64-symbols
          path: symbols/
          if-no-files-found: warn

      # Once per binary the tarball carries: the engine's build id is its own, and a crash report from
      # a headless run is readable only if THAT binary's symbols were archived (the Build step's
      # POST_BUILD archived both). The assertions are tools/check-symbol-archive-linux.sh's, which is
      # what this step's body used to be, for cascade alone.
      - name: Check the symbol archive
        run: |
          set -eu
          bash tools/check-symbol-archive-linux.sh cascade main.cpp
          bash tools/check-symbol-archive-linux.sh foxsdr-engine engine_main.cpp

  # THE ENGINE WITHOUT A WINDOW (engine extraction stage 7g), the way a Raspberry Pi image with
  # no desktop would build it: CASCADE_BUILD_INTERFACE=OFF, and only the packages the engine
  # itself needs - no libgl1-mesa-dev, no X11, no Wayland, no xkbcommon, no xvfb. The two jobs
  # above build the window application too and so cannot show that. This one configures, builds
  # foxsdr-engine, runs it, and checks its symbols were archived.
  #
  # CMAKE_DISABLE_FIND_PACKAGE_OpenGL=ON makes the proof independent of what the runner image
  # happens to have installed: with it, a find_package(OpenGL REQUIRED) that the OFF path reached
  # would fail the configure (tests/engine_only_configure.cmake runs the same pair, with a control,
  # on every full build). It builds no tests - the test programs link the window or spawn cascade.
  #
  # NOT YET RUN ON A RUNNER. Whether the minimal package list below is the whole of it (PortAudio's
  # ALSA backend is the one to watch) is exactly what the first run will say; the job is not one of
  # release.ps1's RequiredCiJobs, so a correction here holds up nothing.
  linux-engine-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the engine's dependencies only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libsoapysdr-dev libssl-dev libunwind-dev libasound2-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCASCADE_BUILD_INTERFACE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_OpenGL=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: The engine runs
        run: |
          set -eu
          version=$(sed -n 's/^project(cascade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test ! -e build/cascade
          line=$(./build/foxsdr-engine --version | head -n 1)
          echo "$line"
          test "$line" = "FoxSDR $version"
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' | sudo tee /etc/asound.conf
          ./build/foxsdr-engine --seconds 2
          ls build/resources/bandplans/*.json build/resources/firmware/aor/NOTICE

      - name: Check the symbol archive
        run: bash tools/check-symbol-archive-linux.sh foxsdr-engine engine_main.cpp

  # THE WINDOWS BUILD: Release, installer, MSIX, symbols. NEW, and not yet run on
  # a runner: every step below is written from the documentation and from what the
  # release machine does, and the first push will show which of them needs
  # correcting. Linux's jobs above are unchanged and independent of this one.
  #
  # WHY windows-2022 AND NOT windows-latest. "windows-latest" is Windows Server
  # 2025 with Visual Studio 2026 only (actions/runner-images README, 2026-10-06:
  # windows-latest = windows-2025-vs2026), and CMakeLists.txt is configured with
  # the "Visual Studio 17 2022" generator on the release machine. windows-2022
  # carries Visual Studio Enterprise 2022 17.14, Windows SDK 10.0.26100.0, CMake
  # 3.31.6, Python 3.14.7 in its tool cache and Inno Setup 6.7.1 (same readme).
  #
  # WHAT THE CMAKE NEEDS FROM VCPKG: one package, soapysdr (CMakeLists.txt:
  # find_package(SoapySDR CONFIG REQUIRED)). Everything else - Dear ImGui, GLFW,
  # PortAudio, pffft, nlohmann/json, cpp-httplib - is vendored under third_party/
  # and built by CMake itself; OpenSSL is not used on Windows (CNG and WinHTTP
  # instead). There is no vcpkg.json manifest and there must not be one at the
  # repository root: with the toolchain file in use it would switch every local
  # build to manifest mode and away from C:\vcpkg\installed.
  #
  # THE PIN. VCPKG_COMMIT is `git -C C:\vcpkg rev-parse HEAD` on the machine that
  # builds the shipped installer (2026-10-06); that tree has soapysdr 0.8.1,
  # port-version 0 (installed\vcpkg\info\soapysdr_0.8.1_x64-windows.list). The
  # job checks out vcpkg at that commit instead of using the runner's own
  # C:\vcpkg, whose commit is whatever the image was built with, and refuses to
  # go on if the installed version is not the one expected. When the release
  # machine's vcpkg moves, move this commit with it (and SOAPYSDR_EXPECTED).
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_COMMIT: 19780d9cdf84d0944cf9a318666703b89ab6629c
      SOAPYSDR_EXPECTED: 0.8.1
      VCPKG_DISABLE_METRICS: "1"
      # vcpkg's binary cache (docs: learn.microsoft.com/vcpkg/users/binarycaching,
      # "Default binary cache": %VCPKG_DEFAULT_BINARY_CACHE% is the first location
      # the default files provider looks at). The folder is restored from, and
      # saved to, GitHub's cache below, so soapysdr is compiled once per pinned
      # commit and not on every push.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-archives
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        shell: pwsh
        run: |
          $text = Get-Content -Raw CMakeLists.txt
          $m = [regex]::Match($text, '(?m)^project\(cascade VERSION (\d+\.\d+\.\d+)')
          if (-not $m.Success) { throw 'no project(cascade VERSION x.y.z line in CMakeLists.txt' }
          "CASCADE_VERSION=$($m.Groups[1].Value)" >> $env:GITHUB_ENV
          "version $($m.Groups[1].Value)"

      # archive-symbols.ps1 and build-msix.ps1 both run `py -3.14` (the symbol map
      # export and the Store logos), and the logos need Pillow.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # If the py launcher does not know the interpreter setup-python installed,
      # `py -3.14` is made to resolve to it with a small shim ahead of it on PATH.
      # Skipped when the launcher already answers.
      - name: Make "py -3.14" resolve, and install Pillow
        shell: pwsh
        run: |
          py -3.14 --version
          if ($LASTEXITCODE -ne 0) {
            $shim = Join-Path $env:RUNNER_TEMP 'pyshim'
            New-Item -ItemType Directory -Path $shim -Force | Out-Null
            @(
              '@echo off',
              'setlocal enabledelayedexpansion',
              'set "rest="',
              'shift',
              ':next',
              'if "%~1"=="" goto run',
              'set rest=!rest! "%~1"',
              'shift',
              'goto next',
              ':run',
              'python !rest!'
            ) | Set-Content -Path (Join-Path $shim 'py.cmd') -Encoding ascii
            $shim >> $env:GITHUB_PATH
            $env:PATH = "$shim;$env:PATH"
            py -3.14 --version
            if ($LASTEXITCODE -ne 0) { throw 'py -3.14 does not resolve even through the shim' }
          }
          py -3.14 -m pip install --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw 'pip install pillow failed' }

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-2022-${{ env.VCPKG_COMMIT }}-soapysdr-x64-windows

      - name: vcpkg at the pinned commit, and SoapySDR
        shell: pwsh
        run: |
          function Run { & $args[0] $args[1..($args.Count - 1)]; if ($LASTEXITCODE -ne 0) { throw "failed: $($args -join ' ')" } }
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          Run git init $root
          Run git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          Run git -C $root fetch --depth 1 origin $env:VCPKG_COMMIT
          Run git -C $root checkout --detach FETCH_HEAD
          Run "$root\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          Run "$root\vcpkg.exe" install soapysdr:x64-windows
          $listed = & "$root\vcpkg.exe" list soapysdr
          $listed
          if (($listed -join "`n") -notmatch ('soapysdr:x64-windows\s+' + [regex]::Escape($env:SOAPYSDR_EXPECTED))) {
            throw "soapysdr is not $env:SOAPYSDR_EXPECTED: this build would not be against the shipped dependency set"
          }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV

      # Saved HERE, before the build, so a failure further down does not throw away
      # the half-hour of compiling it just paid for.
      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-2022-${{ env.VCPKG_COMMIT }}-soapysdr-x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }

      # Twice, as on the release machine: the second pass must change nothing, and
      # printing both hashes shows whether it did. Only the `cascade` target, because
      # the installer and the package need nothing else; the POST_BUILD step on it is
      # what archives the symbols (CMakeLists.txt).
      - name: Build, twice
        shell: pwsh
        run: |
          foreach ($pass in 1, 2) {
            # `-m` alone: PowerShell hands a native command `-m:4` as `-m:` and `4`,
            # and MSBuild answers MSB1031 "Specify the maximum number of CPUs" (the
            # first run, 37615786440). Without a count MSBuild uses every core.
            cmake --build build --config Release --target cascade -- -m
            if ($LASTEXITCODE -ne 0) { throw "build pass $pass failed" }
            "pass ${pass}: $((Get-FileHash build\Release\cascade.exe -Algorithm SHA256).Hash)"
          }

      # The binary has to say the version it was built as. Read through redirected
      # files, which works whether cascade.exe is a console or a Windows-subsystem
      # program (from PowerShell `& cascade.exe --version` captures nothing for the
      # second kind).
      - name: Check the binary names its own version
        shell: pwsh
        run: |
          $exe = (Resolve-Path build\Release\cascade.exe).Path
          $out = Join-Path $env:RUNNER_TEMP 'version.out'
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -RedirectStandardOutput $out -RedirectStandardError "$out.err" -Wait -PassThru -NoNewWindow
          $line = (Get-Content $out | Where-Object { $_.Trim() -ne '' } | Select-Object -First 1)
          "exit $($p.ExitCode): $line"
          if ($p.ExitCode -ne 0 -or $line.Trim() -ne "FoxSDR $env:CASCADE_VERSION") { throw "expected 'FoxSDR $env:CASCADE_VERSION'" }

      - name: Find Inno Setup and the VC redistributable
        shell: pwsh
        run: |
          $iscc = $null
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          foreach ($c in $candidates) { if (Test-Path $c) { $iscc = $c; break } }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            foreach ($c in $candidates) { if (Test-Path $c) { $iscc = $c; break } }
          }
          if (-not $iscc) { throw 'Inno Setup is not on the runner and choco could not install it' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object { Test-Path "$($_.FullName)\x64\Microsoft.VC143.CRT\msvcp140.dll" } |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crt) { throw "no x64 Microsoft.VC143.CRT under $vs\VC\Redist\MSVC" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
          "VCCRT=$($crt.FullName)\x64\Microsoft.VC143.CRT" >> $env:GITHUB_ENV
          "ISCC $iscc"
          "CRT  $($crt.FullName)"

      - name: Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          & $env:ISCC "/O$PWD\out" "/DBuildDir=$PWD\build\Release" "/DVcCrtDir=$env:VCCRT" installer\cascade.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          Get-ChildItem out | Format-Table Name, Length
          if (-not (Test-Path "out\foxsdr-setup-$env:CASCADE_VERSION.exe")) { throw 'the installer is not named for the version' }

      # The Store package, with the Partner Center identity of the real product, so it
      # is the same package a release submits (unsigned: the Store signs it). Needs
      # makeappx and makepri from the Windows SDK, which build-msix.ps1 finds under
      # C:\Program Files (x86)\Windows Kits\10\bin.
      - name: MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path msix-in\softgl -Force | Out-Null
          Copy-Item build\Release\cascade.exe, build\Release\SoapySDR.dll msix-in\
          # The software OpenGL renderer (0.99.90, third_party\softgl\README.md): the build
          # stages it in build\Release\softgl and build-msix.ps1 requires exactly its two files.
          Copy-Item build\Release\softgl\opengl32.dll, build\Release\softgl\libgallium_wgl.dll msix-in\softgl\
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer\msix\build-msix.ps1 `
            -BuildDir "$PWD\msix-in" -VcCrtDir $env:VCCRT `
            -IdentityName hedgerowlabs.FoxSDR -IdentityPublisher "CN=A483DBDF-9D74-4013-9DFA-B1BE0334C31F" `
            -PublisherDisplayName hedgerowlabs -Force
          if ($LASTEXITCODE -ne 0) { throw 'build-msix.ps1 failed' }
          Get-ChildItem installer\msix\Output | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-windows-installer
          path: out/foxsdr-setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-windows-msix
          path: installer/msix/Output/FoxSDR-*-x64.msix

      # THE SYMBOLS FOR THIS EXACT BUILD, KEPT: the Windows half of what the Linux
      # jobs do. The Build step's POST_BUILD ran tools/archive-symbols.ps1 on this
      # runner, which wrote symbols\cascade.pdb\<build id>\{cascade.pdb,symmap.json.gz}
      # and symbols\cascade.exe\<stamp>\cascade.exe, keyed by the CodeView build id of
      # the very cascade.exe the installer and the package contain. The runner is
      # discarded when the job ends. As on Linux these last two steps are LAST on
      # purpose: a mistake in this bookkeeping can turn the job red but cannot
      # withhold the installer or the package.
      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-windows-symbols
          path: symbols/
          if-no-files-found: warn

      - name: Check the symbol archive
        shell: pwsh
        run: |
          $paths = @(& .\tools\archive-symbols.ps1 -Binary (Resolve-Path build\Release\cascade.exe).Path -ArchiveRoot (Join-Path $PWD 'symbols') -Version $env:CASCADE_VERSION -EmitPaths)
          $paths
          if ($paths.Count -lt 4) { throw 'the archiver returned fewer than the pdb, the exe, the map and index.txt' }
          foreach ($rel in $paths) {
            $full = Join-Path 'symbols' $rel
            if (-not (Test-Path $full) -or (Get-Item $full).Length -eq 0) { throw "missing or empty: $full" }
          }
          if (-not ($paths -match 'symmap\.json\.gz$')) { throw 'no symbol map: the crash dashboard groups faults by it' }
