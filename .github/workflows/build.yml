# Continuous build and test.
#
# Linux is built and tested on every push, on both x86_64 (ubuntu-latest) and
# aarch64 (ubuntu-24.04-arm, GitHub's hosted Arm64 runner for public repos -
# see the "arm64" job below) for the Raspberry Pi and other Arm64 Linux
# desktops. Windows is deliberately NOT built here: the Windows build
# consumes SoapySDR from a local vcpkg tree, and a CI runner that installs
# its own copy would be testing a different dependency set than the one the
# shipped installer is built against. The Windows build is verified locally
# before release instead.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libasound2-dev is PortAudio's backend; the -plugins package lets ALSA's
      # default device route to a sound server, which is what makes the audio
      # test meaningful on a machine with no hardware card.
      #
      # The wayland packages are not optional on a runner: GLFW enables Wayland
      # whenever it finds the headers, and the runner image ships those but not
      # libwayland-bin, so configure fails looking for wayland-scanner. Adding
      # the tool is the right fix rather than switching Wayland off — it is the
      # default session on current desktops, and X11-only would leave those
      # users on XWayland.
      #
      # libunwind-dev is the Linux crash handler's and hang watchdog's local
      # unwinder (CMakeLists.txt, pkg_check_modules(LIBUNWIND REQUIRED)).
      # Without it configure stops at "The following required packages were
      # not found: libunwind" - which is how every push from 0.99.2 to 0.99.4
      # failed here in about thirty seconds, and why those releases' Linux
      # builds had to be made by hand.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libsoapysdr-dev libssl-dev libunwind-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libasound2-dev libasound2-plugins \
            xvfb libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The runner has no audio device at all. Rather than let that fail the
      # job, a dummy ALSA device is provided so the audio path is still
      # exercised; without this the sink tests would have to be skipped, and a
      # skipped test proves nothing.
      - name: Provide a null audio device
        run: |
          sudo modprobe snd-dummy || true
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' | sudo tee /etc/asound.conf

      # Under a virtual X server, because one test opens a real window and a
      # bare runner has no display at all — GLFW reports "failed to detect any
      # supported platform" and the smoke test cannot start. Xvfb plus Mesa's
      # software renderer means that path is actually exercised here rather
      # than excluded, which is the whole point of having it.
      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      # The selftest drives the real DSP chain headlessly and asserts a known
      # spectrum peak, so it catches a build that links and passes unit tests
      # but produces wrong numbers.
      - name: Selftest
        run: ./build/cascade --selftest

      - name: Package
        run: |
          version=$(sed -n 's/^project(cascade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p "dist/foxsdr-$version-linux-x64"
          cp build/cascade README.md LICENSE PRIVACY.md "dist/foxsdr-$version-linux-x64/"
          tar -C dist -czf "foxsdr-$version-linux-x64.tar.gz" "foxsdr-$version-linux-x64"
          echo "version=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-x64
          path: foxsdr-*-linux-x64.tar.gz

      # A single-file, double-clickable alternative to the tarball above, for
      # a desktop user who has no interest in extracting an archive and
      # setting up a .desktop entry by hand. installer/linux/build-appimage.sh
      # stages the SAME payload the "Package" step above already produces
      # (the cascade binary and resources/bandplans it reads at runtime) plus
      # the licensing text a distributable build must carry - it does not
      # bundle SoapySDR/OpenSSL/ALSA/OpenGL, so this runner's host libraries
      # are exactly what a machine running the AppImage also needs, same as
      # the tarball already requires.
      #
      # squashfs-tools is not guaranteed on every runner image (appimagetool
      # shells out to the system mksquashfs rather than bundling one), so it
      # is installed explicitly here instead of assuming it rode in with
      # something else.
      - name: Build AppImage
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools
          installer/linux/build-appimage.sh build

      # The AppImage runtime itself needs FUSE to mount, which this runner
      # does not have configured; extract-and-run is the same fallback used
      # to build it, and covers a user's FUSE-less container or CI runner as
      # much as it covers this one - a real desktop session normally has FUSE
      # and never needs it. Both checks mirror the "Selftest" and "Test"
      # steps above: an exact frame count, not just a nonzero exit code.
      - name: Verify AppImage runs
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          version=$(sed -n 's/^project(cascade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          appimage="dist/FoxSDR-$version-x86_64.AppImage"
          "$appimage" --version
          xvfb-run -a "$appimage" --frames 60

      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-x64-appimage
          path: dist/FoxSDR-*-x86_64.AppImage

      # THE SYMBOLS FOR THIS EXACT BUILD, KEPT.
      #
      # The Build step's last action (tools/archive-symbols-linux.sh, wired in
      # CMakeLists.txt) wrote symbols/ on this runner: the split-debug file
      # that carries the line tables, the function map and an index row, keyed
      # by the GNU build id of the very build/cascade the tarball and the
      # AppImage above contain. The runner is discarded when the job ends, so
      # without this step the build that reaches users has its symbols
      # nowhere, and every crash report against it can be named at best and
      # never placed on a line. Copying the artifact into the symbol archive is
      # still a manual step - docs/DIAGNOSTICS.md, "Linux symbols".
      #
      # The two steps below are LAST on purpose: the tarball and the AppImage
      # are already uploaded when they run, so a mistake in this bookkeeping
      # can turn the job red but cannot withhold a release artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-x64-symbols
          path: symbols/
          if-no-files-found: warn

      # What a working symbol archive looks like, asserted: the archived file
      # has line tables, the binary that ships has none (a full-DWARF cascade
      # would be tens of megabytes heavier for every user), and a real address
      # in the shipped binary resolves to a function and a line in the archived
      # file with the same addr2line a developer will use. Matches are done
      # with case rather than a pipe into grep -q, because a pipe plus
      # pipefail turns grep's early exit into a spurious failure.
      - name: Check the symbol archive
        run: |
          set -eu
          id=$(readelf -n build/cascade | sed -n 's/.*Build ID: \([0-9a-f]*\).*/\1/p')
          test -n "$id"
          dbg="symbols/cascade.debug/$id/cascade.debug"
          echo "build id $id"
          ls -l build/cascade "$dbg"
          dbg_sections=$(readelf -S -W "$dbg")
          bin_sections=$(readelf -S -W build/cascade)
          printf '%s\n' "$dbg_sections" | grep -E '\.debug_(info|line)' || true
          case "$dbg_sections" in
            *.debug_line*) ;;
            *) echo "FAIL: the archived split-debug file has no line tables"; exit 1 ;;
          esac
          case "$bin_sections" in
            *.debug_info*|*.debug_line*) echo "FAIL: the binary that ships still carries DWARF"; exit 1 ;;
          esac
          addr=$(nm build/cascade | awk '$2 == "T" && $3 == "main" { print $1 }')
          test -n "$addr"
          where=$(addr2line -f -C -e "$dbg" "0x$addr")
          echo "$where"
          case "$where" in
            *main.cpp:[0-9]*) ;;
            *) echo "FAIL: main() did not resolve to a source line in the archived file"; exit 1 ;;
          esac

  # Same job as "linux" above, on GitHub's hosted Arm64 runner, for the
  # Raspberry Pi (64-bit Raspberry Pi OS is aarch64) and other Arm64 Linux
  # desktops. "ubuntu-24.04-arm" is GitHub's documented label for the free
  # hosted Arm64 runner available to public repositories; every step below
  # is the "linux" job's step unchanged except for the runner label and the
  # arch-derived file names (build-appimage.sh itself picks its own
  # architecture via `uname -m`, so it needs no arch argument here).
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libsoapysdr-dev libssl-dev libunwind-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libasound2-dev libasound2-plugins \
            xvfb libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Provide a null audio device
        run: |
          sudo modprobe snd-dummy || true
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' | sudo tee /etc/asound.conf

      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Selftest
        run: ./build/cascade --selftest

      - name: Package
        run: |
          version=$(sed -n 's/^project(cascade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p "dist/foxsdr-$version-linux-arm64"
          cp build/cascade README.md LICENSE PRIVACY.md "dist/foxsdr-$version-linux-arm64/"
          tar -C dist -czf "foxsdr-$version-linux-arm64.tar.gz" "foxsdr-$version-linux-arm64"
          echo "version=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-arm64
          path: foxsdr-*-linux-arm64.tar.gz

      - name: Build AppImage
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools
          installer/linux/build-appimage.sh build

      - name: Verify AppImage runs
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          version=$(sed -n 's/^project(cascade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          appimage="dist/FoxSDR-$version-aarch64.AppImage"
          "$appimage" --version
          xvfb-run -a "$appimage" --frames 60

      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-arm64-appimage
          path: dist/FoxSDR-*-aarch64.AppImage

      # The same two steps as the "linux" job's closing pair (read the comments
      # there), for the arm64 build. Its build id is its own, so its symbols
      # are a separate artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: foxsdr-linux-arm64-symbols
          path: symbols/
          if-no-files-found: warn

      - name: Check the symbol archive
        run: |
          set -eu
          id=$(readelf -n build/cascade | sed -n 's/.*Build ID: \([0-9a-f]*\).*/\1/p')
          test -n "$id"
          dbg="symbols/cascade.debug/$id/cascade.debug"
          echo "build id $id"
          ls -l build/cascade "$dbg"
          dbg_sections=$(readelf -S -W "$dbg")
          bin_sections=$(readelf -S -W build/cascade)
          printf '%s\n' "$dbg_sections" | grep -E '\.debug_(info|line)' || true
          case "$dbg_sections" in
            *.debug_line*) ;;
            *) echo "FAIL: the archived split-debug file has no line tables"; exit 1 ;;
          esac
          case "$bin_sections" in
            *.debug_info*|*.debug_line*) echo "FAIL: the binary that ships still carries DWARF"; exit 1 ;;
          esac
          addr=$(nm build/cascade | awk '$2 == "T" && $3 == "main" { print $1 }')
          test -n "$addr"
          where=$(addr2line -f -C -e "$dbg" "0x$addr")
          echo "$where"
          case "$where" in
            *main.cpp:[0-9]*) ;;
            *) echo "FAIL: main() did not resolve to a source line in the archived file"; exit 1 ;;
          esac
