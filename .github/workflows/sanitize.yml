# Memory-error, undefined-behaviour and fuzz testing on Linux.
#
# A SEPARATE WORKFLOW FROM build.yml, ON PURPOSE. build.yml's two jobs produce
# the artifacts that are released (the tarballs, the AppImages, the symbol
# archives); nothing here may slow them down or colour their result, and a
# workflow of its own is the only arrangement that guarantees it: its checks
# appear beside theirs as a distinct, separately named status, it starts
# nothing of theirs, and it is not part of their run. It is also not a
# required check unless the repository is configured to make it one. build.yml
# is not edited by the change that added this file.
#
# THREE JOBS, because they need different things:
#
#   sanitize  GCC, the compiler the release jobs ship with. The whole suite
#             built with AddressSanitizer + UndefinedBehaviorSanitizer (and
#             LeakSanitizer, which is part of ASan on Linux) and run under
#             xvfb with the null audio device, exactly as build.yml runs it.
#   tsan      Clang 18, ThreadSanitizer. Clang and not GCC because GCC 13's
#             libtsan has no interceptor for pthread_mutex_clocklock, which
#             libstdc++ calls for every std::timed_mutex::try_lock_for, so
#             TSan never sees the lock, reports every unlock of such a mutex as
#             "unlock of an unlocked mutex" and loses the happens-before edge
#             the lock gives (the interceptor is in LLVM 18; the first run,
#             37355910809, failed three tests on it). It cannot share a build
#             with ASan (the two will not live in one process), so it is a
#             build of its own, and it runs a SELECTION of the suite - the
#             tests that put our threads against each other (tests/tsan.cmake
#             says which, and why the rest are out).
#   fuzz      Clang, because libFuzzer is Clang's. The fuzz targets in
#             tests/fuzz, built with ASan + UBSan + libFuzzer, the regression
#             corpus replayed first and then each target fuzzed for a short,
#             fixed time.
#
# They run in parallel on separate runners and none waits for another. A
# Clang build failure (this code base has only ever been compiled with GCC and
# MSVC) therefore costs the fuzz job and leaves the other two results intact.
#
# HOW TO RUN IT ON A BRANCH. "Run workflow" in the Actions tab, or
#   gh workflow run sanitize.yml --ref <branch> -f fuzz_seconds=60
# - which GitHub only offers for a workflow file that exists on the default
# branch. Until then the push trigger below starts it on any branch (not
# master) whose push changes the sanitizer or fuzz files themselves.
#
# THE NIGHTLY LEG (the `schedule:` trigger below). The same file, not a second
# one: at 02:23 UTC every night the default branch gets
#   sanitize  the whole suite under ASan + UBSan, exactly as above;
#   fuzz      a BOUNDED pass over the parsers that take input from outside the
#             process - CAT lines, the web control JSON, config.json, the plugin
#             catalogue and manifest JSON, and the web server's HTTP front door -
#             after the whole regression corpus is replayed, 120 s per target,
#             the job capped at 60 minutes (the manual and push runs keep 21
#             targets at 60 s and 180 minutes);
#   tsan      NOT run nightly. Its recorded results are 39 of 70 tests failing on
#             the first run (docs/SANITIZERS-AND-FUZZING.md) and a failed Build
#             step in run 40405682371 (2026-10-26, branch engine/stage4); with
#             halt_on_error each test shows only its first report, so a nightly
#             of it would be red every night while the next layer is peeled, and
#             a red that is expected is a red that gets ignored - the two jobs
#             that can be made to mean something would go with it. Run it by hand
#             until it has been green once, then delete the `if:` on the job.
# Three things about `schedule` that are GitHub's, not ours:
#   - It runs ONLY from the default branch, and only once this file is on it.
#     Until it is merged there nothing here fires on a timer; a branch can still
#     use workflow_dispatch / the push trigger.
#   - Notifications for a scheduled workflow go to the user who last modified
#     the cron line (GitHub's docs, checked 2026-10-27), nobody else. No
#     secret and no chat hook is configured, on purpose; what the run does
#     instead is say what failed on the run's summary page and attach the
#     crash inputs (artifact fuzz-crash-inputs). Look with
#       gh run list --workflow sanitize.yml --event schedule
#   - A scheduled workflow in a public repository is switched off by GitHub
#     after 60 days with no repository activity, and a run can start late when
#     GitHub is busy (hence a minute that is not on the hour).
# By hand, the same thing: see "CI" in docs/SANITIZERS-AND-FUZZING.md.
#
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
name: sanitize

on:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds to fuzz each target (the corpus replay is separate and always runs)"
        default: "60"
        required: false
      fuzz_targets:
        description: "Space-separated fuzz targets to fuzz (e.g. cat_command config); empty = all of them. The corpus replay always covers all"
        default: ""
        required: false
  # The nightly leg: see the header. 02:23 UTC, off the hour on purpose.
  schedule:
    - cron: "23 2 * * *"
  push:
    branches-ignore: [master]
    paths:
      - ".github/workflows/sanitize.yml"
      - "cmake/sanitize.cmake"
      - "tests/fuzz/**"
      - "tests/tsan.cmake"
      - "tools/sanitize/**"

# One run per ref: a newer push replaces a run still in progress.
# The nightly has a group of its own, so a manual run on master neither cancels
# it nor is cancelled by it.
concurrency:
  group: sanitize-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-24.04
    # A Release build of ~270 programs with instrumentation, then the suite at
    # up to several times its normal run time, on four cores.
    timeout-minutes: 240
    env:
      # THE RUNTIME OPTIONS, spelled out. cmake/sanitize.cmake attaches the same
      # strings to every test as its CTest ENVIRONMENT (so a local Linux run and
      # this one agree); they are repeated here for the steps that do not go
      # through CTest, and so that the policy can be read in one place:
      #   halt_on_error / abort_on_error=0 : the first report ends the process
      #                                      with a nonzero exit, not a core dump
      #   print_stacktrace / symbolize     : every report carries a stack
      #   detect_leaks=1                   : LeakSanitizer on, with the library
      #                                      suppressions in tools/sanitize/lsan.supp
      #   detect_stack_use_after_return    : the use-after-scope class
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=0:print_stacktrace=1:symbolize=1:strict_string_checks=1:detect_stack_use_after_return=1:allocator_may_return_null=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:symbolize=1
      LSAN_OPTIONS: print_suppressions=0:suppressions=${{ github.workspace }}/tools/sanitize/lsan.supp
    steps:
      - uses: actions/checkout@v4

      # The same package set as build.yml's "linux" job, plus llvm-symbolizer so
      # a report names file and line instead of an address.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libsoapysdr-dev libssl-dev libunwind-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libasound2-dev libasound2-plugins \
            xvfb libgl1-mesa-dri \
            llvm-18
          echo "ASAN_SYMBOLIZER_PATH=$(command -v llvm-symbolizer-18)" >> "$GITHUB_ENV"

      # Hosted runners on recent kernels randomise mmap with more entropy than
      # AddressSanitizer's fixed shadow mapping tolerates, and the result is an
      # instant "DEADLYSIGNAL" in every instrumented program. Lowering it is the
      # documented workaround. Harmless where it is not needed.
      - name: Make the address space safe for AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCASCADE_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Disk after the build
        run: df -h . && du -sh build

      # As in build.yml: the runner has no audio device, so a dummy ALSA device
      # is provided and the audio path is exercised rather than skipped.
      - name: Provide a null audio device
        run: |
          sudo modprobe snd-dummy || true
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' | sudo tee /etc/asound.conf

      # What is NOT run under the sanitizer, and why, printed where it can be
      # read: CTest lists these as "Not Run (Disabled)" at the end of the suite
      # too. See the list and the reasons in tests/CMakeLists.txt.
      - name: Tests excluded from the sanitizer run
        run: ctest --test-dir build -N -L sanitize-excluded

      # -j2: instrumented test programs hold several times the memory, and the
      # real-time pipeline tests need a core each. Per-test time limits are
      # already scaled by cmake/sanitize.cmake. tee, so the log survives as an
      # artifact even when ctest's own output is truncated in the UI.
      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a ctest --test-dir build --output-on-failure -j2 2>&1 | tee ctest.log

      # NO "cascade --selftest" STEP, as there is none in the TSan job: it is the
      # ctest entry app_selftest, which tests/CMakeLists.txt excludes from every
      # sanitizer run, and for the same reason. It measures the 700 Hz CW sidetone of
      # the built-in generator through the real pipeline, the generator is paced by
      # the wall clock, an instrumented DSP thread falls behind it and the ring drops
      # samples, so the tone read 773 Hz in the first run (37355910809) with no
      # sanitizer report. build.yml runs it in the plain build, where the claim is made.

      # What failed, on the run's summary page, so that a red nightly can be read
      # without opening the 500-test log: the CTest tally, each failed test, and
      # each distinct sanitizer report line with how many tests hit it.
      - name: Summarise the sanitize run
        if: always()
        run: |
          {
            echo "## sanitize (ASan + UBSan, GCC) - ${GITHUB_EVENT_NAME}"
            echo
            if [ ! -f ctest.log ]; then
              echo "No ctest.log: the job stopped before the Test step. Read the failing step above."
            else
              grep -E 'tests passed, [0-9]+ tests failed out of' ctest.log || echo "CTest printed no tally (the run was cut off; see ctest.log in the artifact)."
              echo
              if grep -q '^The following tests FAILED:' ctest.log; then
                echo "### Failed tests"
                echo
                echo '```'
                sed -n '/^The following tests FAILED:/,$p' ctest.log | grep -E '^[[:space:]]+[0-9]+ - '
                echo '```'
                echo
              fi
              if grep -qE '^SUMMARY: [A-Za-z]*Sanitizer' ctest.log; then
                echo "### Sanitizer reports (count of lines, first 40 distinct)"
                echo
                echo '```'
                grep -E '^SUMMARY: [A-Za-z]*Sanitizer' ctest.log | sort | uniq -c | sort -rn | head -40
                echo '```'
                echo
              fi
              echo "The full log is the **sanitize-test-log** artifact. A finding becomes a test: docs/SANITIZERS-AND-FUZZING.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitize-test-log
          path: |
            ctest.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  # THREADSANITIZER. A thread sanitizer's first run on a program with this many
  # threads is normally the one that teaches you what its noise is; the first run
  # (37355910809) did, and tools/sanitize/tsan.supp and tests/tsan.cmake carry what
  # it taught. halt_on_error means each test shows only its FIRST report, so the
  # next run is expected to show the next one: read the log before believing it.
  tsan:
    # Not in the nightly; the reason is in the header of this file. Delete this
    # line to put it there.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # Clang 18, not GCC 13: see the head of this file (pthread_mutex_clocklock).
      CC: clang-18
      CXX: clang++-18
      # halt_on_error: the first race ends the process. second_deadlock_stack: a
      # lock-order report shows both orders. history_size=4: the "previous access"
      # stack of a race that is a while old (the default of 2 loses it). The same
      # string cmake/sanitize.cmake gives every test as its CTest ENVIRONMENT;
      # repeated here for readability and for steps outside CTest. Suppressions are
      # third-party libraries only (tools/sanitize/tsan.supp); nothing of ours is in
      # it.
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=4:symbolize=1:print_suppressions=0:suppressions=${{ github.workspace }}/tools/sanitize/tsan.supp
    steps:
      - uses: actions/checkout@v4

      # The same package set as the fuzz job (clang-18 and the runtime package that
      # carries libclang_rt.tsan); llvm-18 for llvm-symbolizer.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            clang-18 libclang-rt-18-dev \
            libgl1-mesa-dev libsoapysdr-dev libssl-dev libunwind-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libasound2-dev libasound2-plugins \
            xvfb libgl1-mesa-dri \
            llvm-18
          # On PATH under its plain name, which is where every sanitizer looks, so
          # it is found whatever TSAN_OPTIONS says (CTest sets its own).
          sudo ln -sf "$(command -v llvm-symbolizer-18)" /usr/local/bin/llvm-symbolizer

      # ThreadSanitizer maps its shadow at fixed addresses and fails at start-up
      # ("unexpected memory mapping") on a kernel that randomises mmap with more
      # entropy than it allows for; lowering it is the documented workaround.
      - name: Make the address space safe for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCASCADE_SANITIZE=thread

      # Only the tests this job runs (and the libraries they link): the target
      # cascade_tsan_tests is made by tests/tsan.cmake from the list there.
      - name: Build
        run: cmake --build build -j"$(nproc)" --target cascade_tsan_tests

      - name: Provide a null audio device
        run: |
          sudo modprobe snd-dummy || true
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' | sudo tee /etc/asound.conf

      # What is not run, and why, where it can be read: the disabled tests are
      # listed by ctest, and the reasons are in tests/tsan.cmake (the named ones are
      # also printed at configure time).
      - name: Tests not run under ThreadSanitizer
        run: |
          echo "::group::excluded tests"
          ctest --test-dir build -N -L sanitize-excluded
          echo "::endgroup::"
          echo "run: $(ctest --test-dir build -N -L tsan | tail -n 1)"

      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a ctest --test-dir build -L tsan --output-on-failure -j2 2>&1 | tee ctest.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsan-test-log
          path: |
            ctest.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  fuzz:
    runs-on: ubuntu-24.04
    # 180 for a manual or push run (all 21 targets). The nightly is capped at 60:
    # about 8 minutes of install and build (run 40405682371, branch engine/stage4,
    # took 8 minutes before its first target started), 6 targets x 125 s, and room.
    timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 180 }}
    env:
      CC: clang-18
      CXX: clang++-18
      # THE NIGHTLY'S BUDGET, in these two lines: 120 s for each of the parsers
      # that take input from outside the process. A manual run may pass any
      # values (gh workflow run sanitize.yml -f fuzz_seconds=120 -f
      # 'fuzz_targets=cat_command control_request config plugin_index
      # plugin_manifest web_http'); with neither it fuzzes all targets for 60 s.
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '120' || github.event.inputs.fuzz_seconds || '60' }}
      FUZZ_TARGETS: ${{ github.event_name == 'schedule' && 'cat_command control_request config plugin_index plugin_manifest web_http' || github.event.inputs.fuzz_targets || '' }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=0:print_stacktrace=1:symbolize=1:strict_string_checks=1:detect_stack_use_after_return=1:allocator_may_return_null=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:symbolize=1
      LSAN_OPTIONS: print_suppressions=0:suppressions=${{ github.workspace }}/tools/sanitize/lsan.supp
    steps:
      - uses: actions/checkout@v4

      # clang-18 plus the runtime package that carries libFuzzer
      # (libclang_rt.fuzzer), which clang itself does not install.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            clang-18 libclang-rt-18-dev llvm-18 \
            libgl1-mesa-dev libsoapysdr-dev libssl-dev libunwind-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libasound2-dev libasound2-plugins \
            xvfb libgl1-mesa-dri
          echo "ASAN_SYMBOLIZER_PATH=$(command -v llvm-symbolizer-18)" >> "$GITHUB_ENV"

      - name: Make the address space safe for AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      # 'fuzzer' puts libFuzzer's coverage counters into EVERY object, the
      # library included (without them a fuzzer cannot see the code it is for);
      # CASCADE_FUZZ=ON adds the fuzz_<target> executables, which are the only
      # programs that link libFuzzer's main().
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCASCADE_SANITIZE=address,undefined,fuzzer -DCASCADE_FUZZ=ON

      # Only what the fuzz job uses: the replay program and the libFuzzer
      # executables. The whole suite is the other job's business. FUZZ_TARGETS
      # (the nightly's list, or a manual run's) narrows what is built AND fuzzed;
      # empty means every target. A name that is not a target is an error here,
      # not a silent skip. The chosen list is handed to the fuzz step as
      # FUZZ_SELECTED.
      - name: Build
        run: |
          all=$(ctest --test-dir build -N -R '^fuzz_corpus_' | sed -n 's/.*Test *#[0-9]*: fuzz_corpus_//p' | tr '\n' ' ')
          echo "all fuzz targets: $all"
          test -n "$all"
          selected=$(echo $FUZZ_TARGETS)
          selected="${selected:-$(echo $all)}"
          for t in $selected; do
            case " $all" in
              *" $t "*) ;;
              *) echo "::error::'$t' is not a fuzz target (known: $all)"; exit 1 ;;
            esac
          done
          echo "FUZZ_SELECTED=$selected" >> "$GITHUB_ENV"
          targets=$(for t in $selected; do printf 'fuzz_%s ' "$t"; done)
          echo "fuzz targets: $targets"
          cmake --build build -j"$(nproc)" --target fuzz_corpus_replay $targets

      # THE REGRESSION CORPUS FIRST: every seed and every input that ever found
      # a bug, once each, through the instrumented build. A bug that was fixed
      # must stay fixed before any new input is tried.
      - name: Replay the regression corpus
        run: ctest --test-dir build -R '^fuzz_corpus_' --output-on-failure

      # THEN EACH TARGET FOR A SHORT, FIXED TIME. libFuzzer reads the regression
      # corpus as its seed set (the second directory, read-only in effect) and
      # writes what it finds to work/<target>. A crash leaves the offending
      # input in artifacts/ - that file is the bug report: add it to
      # tests/fuzz/corpus/<target>/ with the fix. One target failing does not
      # stop the rest: the status is collected and returned at the end. Each
      # failing target is also written to failed-targets.txt (name, exit status)
      # for the summary step below; the file exists, empty, once this step has
      # started, so "no such file" there means the job never got this far.
      - name: Fuzz each target
        run: |
          mkdir -p work artifacts
          : > failed-targets.txt
          status=0
          for t in $FUZZ_SELECTED; do
            echo "::group::fuzz_$t (${FUZZ_SECONDS}s)"
            mkdir -p "work/$t"
            "build/tests/fuzz_$t" \
              -max_total_time="$FUZZ_SECONDS" -timeout=25 -rss_limit_mb=3072 \
              -print_final_stats=1 -artifact_prefix="artifacts/${t}-" \
              "work/$t" "tests/fuzz/corpus/$t" || { rc=$?; echo "::error::fuzz_$t found a failure"; echo "$t $rc" >> failed-targets.txt; status=1; }
            echo "::endgroup::"
          done
          exit $status

      # Which target failed, with what input file, and where to get it, on the
      # run's summary page. libFuzzer writes the input that did it to
      # artifacts/<target>-<kind>-<sha1> (kind: crash, leak, oom, timeout,
      # slow-unit); a leak found when the process ends is also "crash".
      - name: Summarise the fuzz run
        if: always()
        run: |
          {
            echo "## fuzz (${GITHUB_EVENT_NAME}): ${FUZZ_SECONDS} s per target"
            echo
            if [ ! -f failed-targets.txt ]; then
              echo "The job stopped before the fuzz step started (install, build or corpus replay). Read the failing step above; no target was fuzzed."
            else
              echo "Targets fuzzed: ${FUZZ_SELECTED}"
              echo
              if [ -s failed-targets.txt ]; then
                echo "### FAILED"
                echo
                while read -r t rc; do
                  echo "- **fuzz_$t** exited $rc"
                done < failed-targets.txt
                echo
                if [ -n "$(find artifacts -type f)" ]; then
                  echo "Input files libFuzzer wrote (artifact **fuzz-crash-inputs**; also inside **fuzz-findings**):"
                  echo
                  echo '```'
                  (cd artifacts && find . -type f -printf '%f  %s bytes\n' | sort)
                  echo '```'
                else
                  echo "libFuzzer wrote no input file: the failure was not caused by an input (it came before one ran, or from the environment). Read the log of this step, group fuzz_<target>."
                fi
                echo
                echo "Reproduce: download the artifact, then run build/tests/fuzz_<target> <file> in a CASCADE_SANITIZE=address,undefined,fuzzer CASCADE_FUZZ=ON build. Then, as docs/SANITIZERS-AND-FUZZING.md says, minimise it (-minimize_crash=1), commit it under tests/fuzz/corpus/<target>/ and write the unit test that fails without the fix."
              else
                echo "No target failed."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Only the inputs that did it, small and findable, kept apart from the
      # corpora in fuzz-findings below.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-inputs
          path: artifacts/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-findings
          path: |
            artifacts/
            work/
          if-no-files-found: ignore
