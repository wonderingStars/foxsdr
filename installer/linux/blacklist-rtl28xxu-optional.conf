# OPTIONAL modprobe blacklist for the RTL2832U's in-tree DVB-T driver.
#
# NOT INSTALLED BY DEFAULT, and not needed by FoxSDR: openWinUsb()
# (src/usb/usbfs_device.cpp) detaches dvb_usb_rtl28xxu automatically at open
# time with USBDEVFS_DISCONNECT_CLAIM, the same mechanism libusb's own Linux
# backend uses for the same purpose. FoxSDR works with this driver bound, on
# every kernel new enough to carry that ioctl (added in 4.10; this file's own
# build and test machine runs 6.18 and every distro still receiving updates
# is well past 4.10).
#
# Install this ONLY if you want the kernel to never touch an RTL-SDR at all -
# for instance a machine dedicated to SDR use where you never want it to
# register as (or be mistaken for) a television tuner, or if some OTHER
# application on the box (a DVB-T viewer, a different SDR tool using an older
# libusb) keeps re-binding the driver between FoxSDR sessions. It has no
# effect on this product's own ability to open the device either way.
#
#   sudo cp blacklist-rtl28xxu-optional.conf /etc/modprobe.d/blacklist-rtl28xxu.conf
#   sudo rmmod dvb_usb_rtl28xxu 2>/dev/null   # unbind one already plugged in
#   # or just unplug and replug the dongle - the blacklist only stops the
#   # driver being loaded for a NEW device match, exactly like `rmmod` plus
#   # a udev re-trigger would.
#
# Reverse it by deleting the file the same way; no reboot is needed for
# either direction, just a re-plug of the dongle.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
