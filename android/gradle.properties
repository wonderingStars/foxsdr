# The native build is 32 translation units of C++20 plus pffft and the ImGui
# core; the default 512 MB daemon heap is enough for Gradle itself but AGP's
# manifest and resource processing is happier with more, and a daemon that
# spends its life garbage collecting makes every build look like a CMake
# problem.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# AndroidX, because every modern AGP template assumes it and the USB slice will
# want androidx.core for the permission flow.
android.useAndroidX=true

# Do NOT let AGP rewrite old support-library references into AndroidX. Nothing
# here uses them, and Jetifier is a whole-classpath bytecode rewrite that costs
# time on every build to fix a problem this project does not have.
android.enableJetifier=false
