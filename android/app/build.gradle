// The FoxSDR application module.
//
// SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---------------------------------------------------------------------------
// THE ANDROID ALPHA BUILD NUMBER - the ONE place it is written.
// ---------------------------------------------------------------------------
//
// Bump this when the alpha needs a new distinguishable build without the
// product version itself changing (a re-signed rebuild, a native fix that
// does not warrant a version bump). It feeds both the version NAME below and
// the native CASCADE_VERSION_SUFFIX passed to CMake, so the app's own
// versionName and the compiled-in versionString() the crash/usage reports
// carry can never say two different alpha numbers.
// BUMPED TO 2 for the build that carries the first fixes from the tester
// list of 2026-09-21 (the phantom "improperly shut down", and a first run
// that no longer feeds all fourteen bundled decoders). The name and the
// versionCode both have to move, or the tester cannot tell this build from
// the one they already have and Android may refuse to install it over it.
def foxsdrAndroidBuildNumber = 2
// READ FROM THE ROOT CMakeLists.txt's `project(cascade VERSION ...)` line, so
// the Android versionName can never drift from the version the native
// library reports: the first alpha build was cut with a hand-copied '0.98.0'
// here while the tree had already moved to 0.98.1, which would have put two
// different versions on one APK. A build whose CMakeLists.txt has no such
// line fails here on purpose rather than shipping "null-android.N".
def foxsdrAndroidBaseVersion = {
    def cmakeLists = new File(rootDir, '../CMakeLists.txt')
    def m = (cmakeLists.text =~ /(?m)^project\(cascade VERSION ([0-9]+\.[0-9]+\.[0-9]+)/)
    if (!m.find()) {
        throw new GradleException("no project(cascade VERSION x.y.z) line in ${cmakeLists}")
    }
    m.group(1)
}()
def foxsdrAndroidVersionSuffix = "-android.${foxsdrAndroidBuildNumber}"

// ---------------------------------------------------------------------------
// RELEASE SIGNING
// ---------------------------------------------------------------------------
//
// Read from ~/.gradle/gradle.properties (Windows: %USERPROFILE%\.gradle\
// gradle.properties) rather than from anything in this repository, because a
// keystore path and its passwords must never be committed:
//
//   FOXSDR_KEYSTORE       absolute path to the .jks
//   FOXSDR_KEYSTORE_PASS  keystore password
//   FOXSDR_KEY_ALIAS      key alias inside it (foxsdr-alpha for the alpha)
//   FOXSDR_KEY_PASS       key password (same as the keystore password here)
//
// tools/build-android-release.sh generates that keystore and writes these
// four properties into WSL's ~/.gradle/gradle.properties; a Windows build
// needs the same four properties written into
// C:\Users\<you>\.gradle\gradle.properties by hand.
//
// ABSENT ON PURPOSE IS NOT A BUILD FAILURE. A debug build, a CI checkout with
// no keystore, or a machine nobody has provisioned yet must still be able to
// run `assembleRelease` and get an (unsigned, uninstallable-as-an-update)
// APK out the other end with a clear warning - never a hard Gradle failure
// that reads like something is broken.
def foxsdrKeystorePath = project.findProperty('FOXSDR_KEYSTORE')
def foxsdrKeystorePass = project.findProperty('FOXSDR_KEYSTORE_PASS')
def foxsdrKeyAlias = project.findProperty('FOXSDR_KEY_ALIAS')
def foxsdrKeyPass = project.findProperty('FOXSDR_KEY_PASS')
def foxsdrCanSignRelease = foxsdrKeystorePath && foxsdrKeystorePass &&
        foxsdrKeyAlias && foxsdrKeyPass && file(foxsdrKeystorePath).exists()

if (!foxsdrCanSignRelease) {
    logger.warn('foxsdr: RELEASE BUILD IS UNSIGNED. Set FOXSDR_KEYSTORE, ' +
            'FOXSDR_KEYSTORE_PASS, FOXSDR_KEY_ALIAS and FOXSDR_KEY_PASS in ' +
            '~/.gradle/gradle.properties (see android/app/build.gradle) to ' +
            'sign it. An unsigned release APK cannot be installed as an ' +
            'update over a previously signed alpha.')
}

android {
    // The namespace is the R/BuildConfig package and the default for relative
    // manifest class names; the applicationId is the identity the Play Store
    // and the device use. They are deliberately different: com.foxsdr is the
    // product, com.foxsdr.app is where its code lives, and changing the code's
    // package must never be able to change the installed app's identity.
    namespace 'com.foxsdr.app'

    compileSdk 34
    // NDK r27.2 is the one the toolchain notes in the task pin. Naming it here
    // rather than taking whatever is installed is what stops a machine with two
    // NDKs producing two different binaries from the same commit.
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.foxsdr'
        // 26 (Android 8.0): the floor for the USB host APIs the radio slice
        // needs, and for the AAudio low-latency path the audio slice will want.
        minSdk 26
        targetSdk 34
        // Bumped from the stale 1 alongside the alpha versionName below - a
        // versionCode that never moved would let Android refuse this as an
        // "older" build than nothing at all. 3 is the tester-fix build
        // (-android.2); it moves with foxsdrAndroidBuildNumber above, and an
        // in-place update over an installed alpha depends on it moving.
        versionCode 3
        // NOT the plain product version any more. This is a SIDELOADABLE
        // ALPHA: every report it sends must be distinguishable from a
        // desktop 0.98.0 release, so the name carries the same
        // "-android.<buildNumber>" suffix as the native versionString()
        // (CASCADE_VERSION_SUFFIX below) - built from the two `def`s above so
        // the app's own version and the compiled-in one can never drift apart.
        // The site's version comparator treats "-<anything>" as a
        // pre-release, which is exactly what an alpha must look like.
        versionName "${foxsdrAndroidBaseVersion}${foxsdrAndroidVersionSuffix}"

        ndk {
            // 64-BIT ONLY, AND THAT IS A DECISION RATHER THAN AN OMISSION.
            // Google Play has required a 64-bit build since 2019 and permits a
            // 64-bit-only upload; armeabi-v7a would double the APK for phones
            // that have not shipped in years, and x86 for emulators that no
            // longer exist. x86_64 is here for the emulator, which is how this
            // will first be seen running.
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                // THE ROOT CMakeLists.txt OF THE REPOSITORY, not a copy, and
                // the WHOLE of it: CASCADE_ANDROID_SHELL_ONLY is gone. That
                // flag used to make the root file return early into
                // src/platform/android, where a placeholder target drew a
                // first screen out of two files of src/gui; the configure now
                // reads to the end and builds cascade_lib for Android with the
                // real interface (src/gui) compiled into it, which
                // src/platform/android links into libfoxsdr.so.
                arguments '-DCASCADE_ANDROID=ON',
                        // c++_shared, not c++_static: this process will load
                        // decoder plugins as separate .so files later, and two
                        // copies of a static libc++ in one process means two
                        // sets of type_info, two operator new/delete pairs and
                        // exceptions that cannot cross the boundary. Choosing
                        // it now costs one 1 MB library in the APK and saves
                        // an unfixable ABI problem later.
                        '-DANDROID_STL=c++_shared',
                        // Makes the NATIVE versionString() (src/core/version.cpp)
                        // say "0.98.0-android.1", matching versionName above -
                        // built from the same two `def`s so a bumped build
                        // number can never update one and not the other.
                        "-DCASCADE_VERSION_SUFFIX=${foxsdrAndroidVersionSuffix}"
                cppFlags '-std=c++20'
                // ONLY THE LIBRARY THE APK NEEDS. The root CMakeLists now also
                // defines the on-device test subset (tests/CMakeLists.txt under
                // CASCADE_ANDROID), and without this AGP would build all of it
                // for every ABI on every `assembleDebug` - minutes of work for
                // binaries no APK packages. tools/run-android-tests.sh builds
                // those from its own configure when they are wanted.
                targets 'foxsdr'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            // The CMake the Android SDK ships (cmake;3.22.1). The root file
            // asks for 3.20 and the Android half for 3.22.
            version '3.22.1'
        }
    }

    signingConfigs {
        if (foxsdrCanSignRelease) {
            release {
                storeFile file(foxsdrKeystorePath)
                storePassword foxsdrKeystorePass
                keyAlias foxsdrKeyAlias
                keyPassword foxsdrKeyPass
            }
        }
    }

    buildTypes {
        debug {
            // Left unminified and debuggable: this is the build a person with
            // a phone installs to see whether the shell runs at all.
            minifyEnabled false
            // Native debug symbols are NOT stripped out of the debug APK, so a
            // logcat backtrace from a tester resolves to function names.
            ndk { debugSymbolLevel 'FULL' }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // SYMBOLS, for the same reason the desktop build archives PDBs in
            // the same action that produces the binary: a stripped release
            // whose symbols were never kept makes every crash report against it
            // unreadable forever, and that cannot be repaired after the fact.
            ndk { debugSymbolLevel 'FULL' }
            if (foxsdrCanSignRelease) {
                signingConfig signingConfigs.release
            }
            // else: left unsigned - see the foxsdrCanSignRelease warning above.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            // TRUE, AND IT WAS FALSE UNTIL THE DECODER PLUGINS ARRIVED. This
            // is a MEASURED change, not a preference, and the measurement is
            // worth recording because the two settings look interchangeable
            // and are not.
            //
            // `false` sets android:extractNativeLibs="false" in the merged
            // manifest: the .so entries are stored uncompressed and
            // page-aligned, the loader maps them straight out of the apk, and
            // NOTHING IS WRITTEN TO THE NATIVE LIBRARY DIRECTORY AT INSTALL
            // TIME. That last clause is the one that matters here. Measured on
            // the x86_64 emulator with this apk installed:
            //
            //   legacyNativeLibraryDir=/data/app/~~.../com.foxsdr-.../lib
            //   $ ls -l .../lib/x86_64
            //   total 0
            //
            // The directory exists and is EMPTY. libfoxsdr.so itself does not
            // care - System.loadLibrary resolves it inside the apk through the
            // classloader's own namespace - but the decoder plugins are found
            // by SCANNING a directory (core/plugin_host.cpp's scan(), which
            // walks it with std::filesystem and dlopen()s what it finds), and
            // an empty directory means no decoder in the product at all, with
            // nothing on screen to explain it.
            //
            // `true` restores extractNativeLibs="true", so the installer
            // unpacks every lib/<abi>/lib*.so of the device's own ABI into
            // that directory - which is what the plugin host is then handed
            // (ApplicationInfo.nativeLibraryDir, read over JNI in
            // core/android_app_info.cpp).
            //
            // WHAT IT COSTS, MEASURED ON THIS APK RATHER THAN ARGUED. The .so
            // entries become DEFLATE compressed, so the apk itself shrinks a
            // long way, and the device then also holds an extracted copy of
            // the primary ABI's libraries:
            //
            //   packaging   apk on disk    installed (code path, du -sk)
            //   false       28 988 869     ~28 MB, nothing extracted
            //   true        10 505 829     24 056 KB (apk + one ABI extracted)
            //
            // So for THIS apk - two ABIs, installed by hand - `true` is
            // smaller on both counts, because the second ABI's 12 MB
            // libfoxsdr.so is compressed rather than stored and is never
            // unpacked. For a Play AAB, which delivers ONE ABI, the arithmetic
            // reverses: `false` would be about one apk-sized download and one
            // copy on disk, `true` a smaller download plus a second copy of
            // the same library. That is the case to revisit before the AAB
            // upload, and it is why the alternative below is written down.
            //
            // THE ALTERNATIVE, if that cost is judged too high before the AAB
            // upload: keep `false` and load the modules from INSIDE the apk by
            // their zip path ("<apk>!/lib/<abi>/libfoxsdr_plugin_x.so", which
            // dlopen has accepted since Android 7). That needs a way to
            // ENUMERATE them, because no filesystem call can list a zip - a
            // small Java helper over java.util.zip.ZipFile, the same shape as
            // Net.java - and it is a bigger change than this slice, so the
            // measurement above and this note are left for whoever makes it.
            // What is NOT an option is unpacking them ourselves into the
            // application's own data directory: Android 10 blocks executing
            // code from an app-writable directory for anything targeting API
            // 29 or above, and this targets 34.
            useLegacyPackaging true
        }
    }

    lint {
        // A lint failure should stop a release, not a person trying to see
        // whether the shell draws. The report is still written either way.
        abortOnError false
        warningsAsErrors false
    }
}

dependencies {
    // The Kotlin standard library is the only dependency, and it is here
    // because MainActivity is Kotlin. Nothing else: this slice has no UI
    // widgets, no networking and no AndroidX components - the whole interface
    // is drawn by the native library.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}

// ---------------------------------------------------------------------------
// THE DECODER PLUGINS, COMPILED INTO THIS APK
// ---------------------------------------------------------------------------
//
// Google Play forbids an application downloading executable code, so the
// modules the desktop build fetches from a catalogue are compiled into the
// signed apk here and loaded from the package's own native library directory
// (see core/plugin_host.hpp and tools/build-android-plugins.sh). Nothing is
// fetched at runtime and the plugin store on Android says so.
//
// GRADLE'S OWN DEFAULT jniLibs DIRECTORY carries them -
// src/main/jniLibs/<abi>/libfoxsdr_plugin_<id>.so - so no sourceSets entry is
// needed and none is added: the fewer places the packaging is described, the
// fewer can disagree. The directory is GITIGNORED, because a built binary does
// not belong in this repository's history and the plugins have a repository of
// their own.
//
// THE PLUGINS ARE A SEPARATE CHECKOUT, so this build does NOT reach for them
// unconditionally: an apk that could only be built next to a sibling tree
// would be unbuildable for anyone without it. Pass the tree and the step runs:
//
//     ./gradlew assembleDebug -PfoxsdrPluginsDir=/path/to/foxsdr-plugins-dev
//
// Without the property, whatever is already staged in jniLibs is packaged and
// a line says which - so "I forgot to build the plugins" and "this apk has no
// decoders in it" can never look the same in the log.
//
// bash IS REQUIRED, and that is why this is opt-in rather than automatic. The
// script cross-compiles with CMake and the NDK; on Windows it needs WSL or Git
// Bash, and a build that silently failed on a machine without either would be
// worse than one that never tried.
def foxsdrPluginsDir = project.findProperty('foxsdrPluginsDir')
def foxsdrJniLibs = file('src/main/jniLibs')

tasks.register('buildFoxsdrPlugins', Exec) {
    description = 'Cross-compiles the FoxSDR decoder plugins into src/main/jniLibs'
    group = 'build'
    workingDir rootProject.projectDir.parentFile
    commandLine 'bash', 'tools/build-android-plugins.sh',
            '--plugins', foxsdrPluginsDir ? foxsdrPluginsDir.toString() : '',
            '--out', foxsdrJniLibs.absolutePath
    onlyIf {
        if (foxsdrPluginsDir == null) {
            logger.lifecycle('foxsdr: -PfoxsdrPluginsDir not set; not building plugins')
            return false
        }
        return true
    }
}

if (foxsdrPluginsDir != null) {
    tasks.named('preBuild') { dependsOn 'buildFoxsdrPlugins' }
}

// WHAT IS ACTUALLY IN THE APK, PRINTED AT CONFIGURE TIME. A count, not a
// promise: this is the one line that tells the difference between an apk with
// fourteen decoders in it and an apk with none, and it is the difference a
// tester cannot see from the outside until they open the plugin store.
gradle.projectsEvaluated {
    def staged = foxsdrJniLibs.exists()
            ? fileTree(foxsdrJniLibs) { include '**/libfoxsdr_plugin_*.so' }.files.size()
            : 0
    logger.lifecycle("foxsdr: ${staged} bundled plugin module file(s) staged in " +
            "${foxsdrJniLibs}")
}

// A plain string on its own line on stdout, for tools/build-android-release.sh
// to capture without parsing Gradle's own log formatting - the alternative
// (grepping the APK listing file or re-deriving the two `def`s above in
// shell) is a second place this version could drift from the one actually
// built.
tasks.register('printVersionName') {
    doLast {
        println(android.defaultConfig.versionName)
    }
}
