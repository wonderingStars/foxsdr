name = "foxsdr-usage"
main = "worker.js"
compatibility_date = "2026-08-18"

# Analytics Engine rather than a database: it is built for exactly this
# shape of write-once, aggregate-read counter, it costs nothing at this
# volume, and it cannot accidentally become a store of per-user history
# because there is nothing to query row-by-row about a person.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "foxsdr_usage"

# Heartbeats live apart from usage ON PURPOSE: one usage row means one
# launch to every reader (the widget, usage.ps1), and a beat every five
# minutes would multiply launches, stability and daily actives by ~12 per
# running hour. "Running now" = count(DISTINCT index1) over the last ten
# minutes of this dataset.
[[analytics_engine_datasets]]
binding = "HEARTBEAT"
dataset = "foxsdr_heartbeat"

# Deliberately NOT set: no KV, no D1, no R2, no logpush. There is nowhere
# for this Worker to persist a request even if a future edit tried to.

# The endpoint lives on the project's own domain, NOT the workers.dev name.
# This URL is compiled into every shipped binary, so it has to be one we can
# repoint later without orphaning copies already installed — exactly the
# reason the plugin catalogue URL is worth moving off a raw GitHub path too.
[[routes]]
pattern = "telemetry.foxsdr.com"
custom_domain = true
